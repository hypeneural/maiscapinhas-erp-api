name: Vendas
description: |-

  Endpoints para consultar vendas registradas.
  Vendas são registradas automaticamente via integração PDV ou manualmente.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/sales
    metadata:
      custom: []
      groupName: Vendas
      groupDescription: |-

        Endpoints para consultar vendas registradas.
        Vendas são registradas automaticamente via integração PDV ou manualmente.
      subgroup: ''
      subgroupDescription: ''
      title: 'Listar vendas'
      description: |-
        Retorna a lista de vendas das lojas às quais o usuário tem acesso,
        com filtros por loja, vendedor e período.

        **Quem pode usar:** Qualquer usuário autenticado (vê apenas suas lojas).

        **Filtros disponíveis:**
        - `store_id` - Filtrar por loja específica
        - `seller_id` - Filtrar por vendedor específico
        - `from` / `to` - Período de datas (formato YYYY-MM-DD)

        **Paginação:** Resultados paginados (padrão 25 por página, máx 100).
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {SEU_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      store_id:
        custom: []
        name: store_id
        description: 'ID da loja para filtrar.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      seller_id:
        custom: []
        name: seller_id
        description: 'ID do vendedor para filtrar.'
        required: false
        example: 6
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      from:
        custom: []
        name: from
        description: 'Data inicial (YYYY-MM-DD).'
        required: false
        example: '2026-01-01'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      to:
        custom: []
        name: to
        description: 'Data final (YYYY-MM-DD).'
        required: false
        example: '2026-01-31'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      per_page:
        custom: []
        name: per_page
        description: 'Itens por página (1-100).'
        required: false
        example: 25
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanQueryParameters:
      store_id: 1
      seller_id: 6
      from: '2026-01-01'
      to: '2026-01-31'
      per_page: 25
    bodyParameters:
      store_id:
