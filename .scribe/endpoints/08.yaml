        description: 'Arquivo de imagem.'
        required: true
        example: null
        type: file
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      remove:
        custom: []
        name: remove
        description: 'Remover avatar atual.'
        required: false
        example: false
        type: boolean
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      remove: false
    fileParameters:
      avatar: null
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "data": {
              "user_id": 5,
              "avatar_url": "https://api.maiscapinhas.com.br/storage/users/5/avatar.jpg"
            },
            "meta": { "request_id": "uuid", "timestamp": "2026-01-07T12:00:00Z" }
          }
        headers: []
        description: 'Avatar atualizado'
      -
        custom: []
