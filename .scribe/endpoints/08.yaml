name: 'Upload de Arquivos'
description: |-

  Endpoints para upload de imagens de avatar e fotos.
endpoints:
  -
    custom: []
    httpMethods:
      - PUT
    uri: 'api/v1/users/{user_id}/avatar'
    metadata:
      custom: []
      groupName: 'Upload de Arquivos'
      groupDescription: |-

        Endpoints para upload de imagens de avatar e fotos.
      subgroup: ''
      subgroupDescription: ''
      title: 'Atualizar avatar do usuário'
      description: |-
        Permite ao usuário atualizar seu próprio avatar ou admins atualizarem
        o avatar de qualquer usuário.

        **Quem pode usar:**
        - O próprio usuário (atualizar seu avatar)
        - Admins (atualizar avatar de qualquer pessoa)

        **Validações:**
        - Tipos: jpg, jpeg, png, webp
        - Tamanho máximo: 2MB
        - Dimensões mínimas: 200x200px
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {SEU_TOKEN}'
      Content-Type: multipart/form-data
      Accept: application/json
    urlParameters:
      user_id:
        custom: []
        name: user_id
        description: 'The ID of the user.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      user:
        custom: []
        name: user
        description: 'ID do usuário.'
        required: true
        example: 5
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
