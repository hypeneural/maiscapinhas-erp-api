      subgroup: ''
      subgroupDescription: ''
      title: 'Enviar mensagem de texto'
      description: 'Envia uma mensagem de texto via WhatsApp.'
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {SEU_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      instance_id:
        custom: []
        name: instance_id
        description: 'The ID of the instance.'
        required: true
        example: 4
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      instance:
        custom: []
        name: instance
        description: 'ID da instância WhatsApp.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
