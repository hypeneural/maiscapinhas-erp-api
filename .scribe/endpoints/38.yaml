      instance: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      number:
        custom: []
        name: number
        description: 'Número do destinatário (com DDI, só dígitos).'
        required: true
        example: '5548999999999'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      text:
        custom: []
        name: text
        description: 'Texto da mensagem (max 4000 chars).'
