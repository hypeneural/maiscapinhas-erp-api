        description: 'ID da loja.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      date:
        custom: []
        name: date
        description: 'Data do turno (YYYY-MM-DD).'
        required: true
        example: '2026-01-07'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      shift_code:
        custom: []
