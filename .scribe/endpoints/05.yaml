        description: 'Status do turno.'
        required: false
        example: open
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      per_page:
        custom: []
        name: per_page
        description: 'Itens por página (1-100).'
        required: false
        example: 25
        type: integer
        enumValues: []
        exampleWasSpecified: true
