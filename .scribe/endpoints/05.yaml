name: 'Turnos de Caixa'
description: |-

  Endpoints para gerenciar turnos de caixa.
  Cada turno representa um período de trabalho de um vendedor em uma loja.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/cash/shifts
    metadata:
      custom: []
