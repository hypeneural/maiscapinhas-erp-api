        description: 'Código do turno (M, T ou N).'
        required: true
        example: M
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      seller_id:
        custom: []
        name: seller_id
        description: 'ID do vendedor (padrão: usuário atual).'
        required: false
        example: 6
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
