      summary: 'Obter perfil do usuário atual'
      operationId: obterPerfilDoUsurioAtual
      description: "Retorna os dados do usuário autenticado, incluindo as lojas\nàs quais ele tem acesso e seu papel (role) em cada uma.\n\n**Quem pode usar:** Qualquer usuário autenticado.\n\n**Informações retornadas:**\n- Dados básicos do usuário (id, nome, email, status ativo)\n- Dados de perfil (whatsapp, avatar_url, instagram)\n- Datas para celebração (birth_date, hire_date)\n- Lista de lojas com o papel do usuário em cada uma\n\n**Papéis possíveis:**\n- `admin` - Administrador global (acesso total)\n- `gerente` - Gerente da loja (gerencia vendedores e metas)\n- `conferente` - Confere fechamentos de caixa\n- `vendedor` - Vendedor (registra vendas e turnos)"
      parameters: []
      responses:
        200:
          description: 'Perfil com múltiplas lojas'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    user:
                      id: 1
                      name: 'Admin Sistema'
                      email: admin@maiscapinhas.com.br
                      active: true
                      whatsapp: '47999999999'
                      avatar_url: 'https://example.com/avatar.jpg'
                      instagram: '@maiscapinhas'
                      birth_date: '1990-05-15'
                      hire_date: '2022-01-09'
                      created_at: '2026-01-01T00:00:00+00:00'
                    stores:
                      -
                        id: 1
                        name: 'Mais Capinhas Tijucas'
                        city: Tijucas
                        role: admin
                      -
                        id: 2
                        name: 'Mais Capinhas Itapema'
                        city: Itapema
                        role: admin
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Admin Sistema'
                          email:
                            type: string
                            example: admin@maiscapinhas.com.br
                          active:
                            type: boolean
                            example: true
                          whatsapp:
                            type: string
                            example: '47999999999'
                          avatar_url:
                            type: string
                            example: 'https://example.com/avatar.jpg'
                          instagram:
                            type: string
                            example: '@maiscapinhas'
                          birth_date:
                            type: string
                            example: '1990-05-15'
                          hire_date:
                            type: string
                            example: '2022-01-09'
                          created_at:
                            type: string
                            example: '2026-01-01T00:00:00+00:00'
                      stores:
                        type: array
                        example:
                          -
                            id: 1
                            name: 'Mais Capinhas Tijucas'
                            city: Tijucas
                            role: admin
                          -
                            id: 2
                            name: 'Mais Capinhas Itapema'
                            city: Itapema
                            role: admin
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 'Mais Capinhas Tijucas'
                            city:
                              type: string
                              example: Tijucas
                            role:
                              type: string
                              example: admin
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
      tags:
        - 'Perfil do Usuário'
    put:
      summary: 'Atualizar perfil do usuário atual'
      operationId: atualizarPerfilDoUsurioAtual
      description: "Permite ao usuário autenticado atualizar seus próprios dados de perfil.\n\n**Quem pode usar:** Qualquer usuário autenticado.\n\n**Campos editáveis:**\n- `email` - Deve ser único e válido\n- `whatsapp` - Formato brasileiro (opcional)"
      parameters: []
      responses:
        200:
          description: 'Perfil atualizado'
