  '/api/v1/admin/stores/{store_id}/users':
    get:
      summary: 'Listar usuários de uma loja'
      operationId: listarUsuriosDeUmaLoja
      description: "Retorna todos os usuários vinculados a uma loja específica,\ncom suas respectivas roles e status.\n\n**Dados retornados por vínculo:**\n- `user_id` - ID do usuário\n- `user_name` - Nome do usuário\n- `user_email` - Email do usuário\n- `user_active` - Se o usuário está ativo\n- `role` - Role do usuário nesta loja\n- `created_at` - Quando o vínculo foi criado\n\n**Quem pode usar:** Apenas administradores."
      parameters: []
      responses:
        200:
          description: 'Usuários da loja'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      user_id: 2
                      user_name: 'Carlos Gerente'
                      user_email: carlos.gerente@maiscapinhas.com.br
                      user_active: true
                      role: gerente
                      created_at: '2026-01-01T00:00:00Z'
                    -
                      user_id: 6
                      user_name: 'João Vendedor'
                      user_email: joao.vendedor@maiscapinhas.com.br
                      user_active: true
                      role: vendedor
                      created_at: '2026-01-01T00:00:00Z'
                properties:
                  data:
                    type: array
                    example:
                      -
                        user_id: 2
                        user_name: 'Carlos Gerente'
                        user_email: carlos.gerente@maiscapinhas.com.br
                        user_active: true
                        role: gerente
                        created_at: '2026-01-01T00:00:00Z'
                      -
                        user_id: 6
                        user_name: 'João Vendedor'
                        user_email: joao.vendedor@maiscapinhas.com.br
                        user_active: true
                        role: vendedor
                        created_at: '2026-01-01T00:00:00Z'
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                          example: 2
                        user_name:
                          type: string
                          example: 'Carlos Gerente'
                        user_email:
                          type: string
                          example: carlos.gerente@maiscapinhas.com.br
                        user_active:
                          type: boolean
                          example: true
                        role:
                          type: string
                          example: gerente
                        created_at:
                          type: string
                          example: '2026-01-01T00:00:00Z'
      tags:
        - 'Administração - Vínculos Loja-Usuário'
    post:
      summary: 'Vincular usuário a loja'
      operationId: vincularUsurioALoja
      description: "Cria um novo vínculo entre um usuário existente e uma loja,\ndefinindo qual role esse usuário terá nessa loja.\n\n**Casos de uso:**\n- Adicionar novo vendedor à equipe de uma loja\n- Promover funcionário a gerente em determinada loja\n- Configurar vendedor \"volante\" para trabalhar temporariamente\n\n**Regras de Negócio:**\n- Um usuário só pode ter um vínculo por loja (unique: store_id + user_id)\n- Para alterar a role, use PUT\n- O usuário deve existir previamente (criar via POST /admin/users)\n\n**Quem pode usar:** Apenas administradores."
      parameters: []
      responses:
        201:
          description: 'Vínculo criado'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    user_id: 8
                    store_id: 1
                    role: vendedor
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 8
                      store_id:
                        type: integer
                        example: 1
                      role:
                        type: string
                        example: vendedor
        422:
          description: 'Usuário já vinculado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    user_id:
                      - 'Este usuário já está vinculado a esta loja.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      user_id:
                        type: array
                        example:
                          - 'Este usuário já está vinculado a esta loja.'
                        items:
                          type: string
      tags:
        - 'Administração - Vínculos Loja-Usuário'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: 'ID do usuário a vincular.'
                  example: 8
                role:
                  type: string
                  description: 'Role: admin, gerente, conferente ou vendedor.'
                  example: vendedor
              required:
                - user_id
                - role
    parameters:
      -
        in: path
        name: store_id
        description: 'The ID of the store.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: store
        description: 'ID da loja.'
        example: 1
        required: true
        schema:
          type: integer
