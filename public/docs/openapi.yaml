    post:
      summary: 'Criar venda manual'
      operationId: criarVendaManual
      description: "Registra uma nova venda no sistema de forma manual.\n\n**Quando usar:**\n- Vendas feitas fora do PDV (dinheiro em espécie direto)\n- Correções de vendas não registradas\n- Vendas de quiosques sem sistema\n\n**Efeitos automáticos:**\nApós criar a venda, o sistema automaticamente dispara:\n1. `RecalculateSellerDailyBonusJob` - recalcula bônus do dia\n2. `RecalculateSellerMonthlyCommissionJob` - recalcula comissão do mês\n\n**Regras de Negócio:**\n- `store_id` deve ser uma loja onde o usuário tem acesso\n- `seller_id` default é o usuário logado\n- `source` default é \"manual\"\n- `amount` deve ser positivo\n\n**Quem pode usar:**\n- Vendedores (podem registrar próprias vendas)\n- Gerentes/Admins (podem registrar para qualquer vendedor)"
      parameters: []
      responses:
        201:
          description: 'Venda criada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 501
                    store_id: 1
                    seller_id: 6
                    sold_at: '2026-01-07T15:30:00Z'
                    amount: 175.5
                    source: manual
                    store:
                      id: 1
                      name: 'Mais Capinhas Tijucas'
                    seller:
                      id: 6
                      name: 'João Vendedor'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 501
                      store_id:
                        type: integer
                        example: 1
                      seller_id:
                        type: integer
                        example: 6
                      sold_at:
                        type: string
                        example: '2026-01-07T15:30:00Z'
                      amount:
                        type: number
                        example: 175.5
                      source:
                        type: string
                        example: manual
                      store:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Mais Capinhas Tijucas'
                      seller:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 6
                          name:
                            type: string
                            example: 'João Vendedor'
        403:
          description: 'Sem acesso à loja'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Você não tem acesso a esta loja.'
                properties:
                  message:
                    type: string
                    example: 'Você não tem acesso a esta loja.'
      tags:
        - Vendas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id:
                  type: integer
                  description: 'Loja onde a venda foi realizada.'
                  example: 1
                seller_id:
                  type: integer
                  description: 'Vendedor que realizou (default: você).'
                  example: 6
                sold_at:
                  type: string
                  description: 'Data/hora da venda (ISO 8601).'
                  example: '2026-01-07T15:30:00'
                amount:
                  type: number
                  description: 'Valor total da venda.'
                  example: 175.5
                source:
                  type: string
                  description: 'Origem: pdv, manual, import (default: manual).'
                  example: manual
              required:
                - store_id
                - sold_at
                - amount
