  /api/v1/reports/cash-integrity:
    get:
      summary: 'Integridade de Caixa'
      operationId: integridadeDeCaixa
      description: "Retorna métricas de auditoria de caixa para uma loja,\nincluindo % de quebra, divergências e alertas.\n\nEste relatório é crítico para:\n- Identificar possíveis fraudes ou roubos\n- Monitorar qualidade operacional\n- Decidir pagamento de bônus\n\n**Métricas retornadas:**\n| Grupo | Métricas |\n|-------|----------|\n| `cash_integrity` | Valores sistema vs real, % quebra, status |\n| `divergence_analysis` | Justificadas vs não justificadas |\n| `workflow_status` | Turnos totais, fechados, pendentes |\n| `alerts` | Alertas automáticos baseados em thresholds |\n\n**Alertas gerados:**\n- `HIGH_CASH_BREAK` (CRITICAL) - Quebra > 5%\n- `ELEVATED_CASH_BREAK` (WARNING) - Quebra > 2%\n- `UNJUSTIFIED_DIVERGENCES` (WARNING) - Divergências sem justificativa\n- `PENDING_BACKLOG` (INFO) - Muitos fechamentos pendentes\n\n**Quem pode usar:** Conferentes, Gerentes e Admins."
      parameters:
        -
          in: query
          name: store_id
          description: 'ID da loja.'
          example: 1
          required: true
          schema:
            type: integer
            description: 'ID da loja.'
            example: 1
        -
          in: query
          name: month
          description: 'Mês (YYYY-MM), default: mês atual.'
          example: 2026-01
          required: false
          schema:
            type: string
            description: 'Mês (YYYY-MM), default: mês atual.'
            example: 2026-01
      responses:
        200:
          description: 'Integridade de caixa'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    store_id: 1
                    period: 2026-01
                    cash_integrity:
                      total_system_value: 150000.0
                      total_real_value: 146250.0
                      total_divergence: -3750.0
                      cash_break_percentage: 2.5
                      status: YELLOW
                    divergence_analysis:
                      total_lines_with_divergence: 15
                      justified_count: 12
                      unjustified_count: 3
                      justified_rate: 80.0
                    workflow_status:
                      total_shifts: 45
                      closed_count: 40
                      pending_approval: 3
                      completion_rate: 88.89
                    alerts:
                      -
                        type: WARNING
                        code: ELEVATED_CASH_BREAK
                        message: 'Quebra de 2.50% acima do limite'
                properties:
                  data:
                    type: object
                    properties:
                      store_id:
                        type: integer
                        example: 1
                      period:
                        type: string
                        example: 2026-01
                      cash_integrity:
                        type: object
                        properties:
                          total_system_value:
                            type: number
                            example: 150000.0
                          total_real_value:
                            type: number
                            example: 146250.0
                          total_divergence:
                            type: number
                            example: -3750.0
                          cash_break_percentage:
                            type: number
                            example: 2.5
                          status:
                            type: string
                            example: YELLOW
                      divergence_analysis:
                        type: object
                        properties:
                          total_lines_with_divergence:
                            type: integer
                            example: 15
                          justified_count:
                            type: integer
                            example: 12
                          unjustified_count:
                            type: integer
                            example: 3
                          justified_rate:
                            type: number
                            example: 80.0
                      workflow_status:
                        type: object
                        properties:
                          total_shifts:
                            type: integer
                            example: 45
                          closed_count:
                            type: integer
                            example: 40
                          pending_approval:
                            type: integer
                            example: 3
                          completion_rate:
                            type: number
                            example: 88.89
                      alerts:
                        type: array
                        example:
                          -
                            type: WARNING
                            code: ELEVATED_CASH_BREAK
                            message: 'Quebra de 2.50% acima do limite'
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              example: WARNING
                            code:
                              type: string
                              example: ELEVATED_CASH_BREAK
                            message:
                              type: string
                              example: 'Quebra de 2.50% acima do limite'
      tags:
        - 'Relatórios Gerenciais'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the stores table.'
                  example: 16
                month:
                  type: string
                  description: 'Must match the regex /^\d{4}-\d{2}$/.'
                  example: 6425-59
              required:
                - store_id
