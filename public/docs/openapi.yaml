      description: "Retorna lista paginada de logs com suporte a diversos filtros.\n\n**Filtros disponíveis:**\n- `from`/`to` - Período de datas\n- `causer_id` - ID do usuário que executou a ação\n- `event` - Nome do evento (suporta wildcard: `auth.*`)\n- `log_name` - Domínio: auth, cash, rules, goals\n- `store_id` - Loja relacionada\n- `subject_type` - Tipo de entidade (CashClosing, BonusRule, etc)\n- `subject_id` - ID da entidade\n\n**Ordenação:** Por data de criação, mais recentes primeiro.\n\n**Quem pode usar:** Apenas administradores."
      parameters:
        -
          in: query
          name: from
          description: 'Data inicial (YYYY-MM-DD).'
          example: '2026-01-01'
          required: false
          schema:
            type: string
            description: 'Data inicial (YYYY-MM-DD).'
            example: '2026-01-01'
        -
          in: query
          name: to
          description: 'Data final (YYYY-MM-DD).'
          example: '2026-01-31'
          required: false
          schema:
            type: string
            description: 'Data final (YYYY-MM-DD).'
            example: '2026-01-31'
        -
          in: query
          name: causer_id
          description: 'ID do usuário.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'ID do usuário.'
            example: 1
        -
          in: query
          name: event
          description: 'Evento (suporta wildcards: auth.*).'
          example: cash_closing.submit
          required: false
          schema:
            type: string
            description: 'Evento (suporta wildcards: auth.*).'
            example: cash_closing.submit
        -
          in: query
          name: log_name
          description: 'Domínio: auth, cash, rules, goals.'
          example: auth
          required: false
          schema:
            type: string
            description: 'Domínio: auth, cash, rules, goals.'
            example: auth
        -
          in: query
          name: store_id
          description: 'ID da loja.'
