        -
          in: query
          name: search
          description: 'Busca por nome ou cidade da loja.'
          example: tijucas
          required: false
          schema:
            type: string
            description: 'Busca por nome ou cidade da loja.'
            example: tijucas
        -
          in: query
          name: active
          description: 'Filtrar por status ativo/inativo.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Filtrar por status ativo/inativo.'
            example: true
        -
          in: query
          name: per_page
          description: 'Itens por página (1-100, default: 25).'
          example: 25
          required: false
