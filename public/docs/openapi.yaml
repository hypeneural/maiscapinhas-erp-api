                          today_sales:
                            type: number
                            example: 450.0
                          average_daily_sales:
                            type: number
                            example: 566.67
                          today_vs_average:
                            type: number
                            example: -116.67
                          status:
                            type: string
                            example: BEHIND
                      my_shifts:
