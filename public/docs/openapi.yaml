                    store_id: 1
                    date: '2026-01-07'
                    shift_code: M
                    seller_id: 6
                    status: open
                    store:
                      id: 1
                      name: 'Mais Capinhas Tijucas'
                    seller:
                      id: 6
                      name: 'João Vendedor'
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      store_id:
                        type: integer
                        example: 1
                      date:
                        type: string
                        example: '2026-01-07'
                      shift_code:
                        type: string
                        example: M
                      seller_id:
                        type: integer
                        example: 6
                      status:
                        type: string
                        example: open
                      store:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Mais Capinhas Tijucas'
                      seller:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 6
                          name:
                            type: string
                            example: 'João Vendedor'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
        403:
          description: 'Sem acesso'
          content:
            application/json:
              schema:
                type: object
                example:
