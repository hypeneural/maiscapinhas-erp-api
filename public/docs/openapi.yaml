  /api/v1/reports/store-performance:
    get:
      summary: 'Performance da Loja'
      operationId: performanceDaLoja
      description: "Retorna métricas completas de performance de uma loja,\nincluindo atingimento de meta, comparação YoY e projeções.\n\nEste relatório é equivalente à planilha de \"Desempenho de Lojas\"\nque o gestor mantinha manualmente.\n\n**Métricas retornadas:**\n| Grupo | Métricas |\n|-------|----------|\n| `sales` | Vendas atuais, meta, atingimento %, restante |\n| `comparison` | Mesmo período ano passado, total ano passado, crescimento YoY |\n| `forecast` | Projeção linear, projeção por tendência, status |\n\n**Status de projeção:**\n- `ON_TRACK` - Projeção >= 100% da meta\n- `AT_RISK` - Projeção entre 90-100% da meta\n- `BEHIND` - Projeção < 90% da meta\n\n**Quem pode usar:** Gerentes e Admins da loja."
      parameters:
        -
          in: query
          name: store_id
          description: 'ID da loja.'
          example: 1
          required: true
          schema:
            type: integer
            description: 'ID da loja.'
            example: 1
        -
          in: query
          name: month
          description: 'Mês (YYYY-MM), default: mês atual.'
          example: 2026-01
          required: false
          schema:
            type: string
            description: 'Mês (YYYY-MM), default: mês atual.'
            example: 2026-01
      responses:
        200:
          description: 'Performance da loja'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    store_id: 1
                    period: 2026-01
                    days_elapsed: 15
                    days_total: 31
                    sales:
                      current_amount: 31981.29
                      goal_amount: 52000.0
                      achievement_rate: 61.5
                      remaining_to_goal: 20018.71
                    comparison:
                      same_period_last_year: 26950.0
                      total_last_year_month: 55835.0
                      yoy_growth: 18.6
                    forecast:
                      linear_projection: 66100.0
                      trend_projection: 66220.31
                      status: ON_TRACK
                properties:
                  data:
                    type: object
                    properties:
                      store_id:
                        type: integer
                        example: 1
                      period:
                        type: string
                        example: 2026-01
                      days_elapsed:
                        type: integer
                        example: 15
                      days_total:
                        type: integer
                        example: 31
                      sales:
                        type: object
                        properties:
                          current_amount:
                            type: number
                            example: 31981.29
                          goal_amount:
                            type: number
                            example: 52000.0
                          achievement_rate:
                            type: number
                            example: 61.5
                          remaining_to_goal:
                            type: number
                            example: 20018.71
                      comparison:
                        type: object
                        properties:
                          same_period_last_year:
                            type: number
                            example: 26950.0
                          total_last_year_month:
                            type: number
                            example: 55835.0
                          yoy_growth:
                            type: number
                            example: 18.6
                      forecast:
                        type: object
                        properties:
                          linear_projection:
                            type: number
                            example: 66100.0
                          trend_projection:
                            type: number
                            example: 66220.31
                          status:
                            type: string
                            example: ON_TRACK
      tags:
        - 'Relatórios Gerenciais'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the stores table.'
                  example: 16
                month:
                  type: string
                  description: 'Must match the regex /^\d{4}-\d{2}$/.'
                  example: 6425-59
              required:
                - store_id
