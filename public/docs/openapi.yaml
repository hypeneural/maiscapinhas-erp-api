  /api/v1/admin/stores:
    get:
      summary: 'Listar todas as lojas'
      operationId: listarTodasAsLojas
      description: "Retorna uma lista completa de todas as lojas cadastradas no sistema,\nincluindo lojas ativas e inativas (para administração).\n\nEste endpoint difere do `/stores` público que mostra apenas\nas lojas às quais o usuário tem acesso.\n\n**Métricas retornadas:**\n- `users_count` - quantidade de usuários vinculados\n\n**Filtros disponíveis:**\n- `search` - busca por nome ou cidade\n- `active` - filtrar por status\n\n**Quem pode usar:** Apenas administradores."
      parameters:
        -
          in: query
          name: search
          description: 'Busca por nome ou cidade da loja.'
          example: tijucas
          required: false
          schema:
            type: string
            description: 'Busca por nome ou cidade da loja.'
            example: tijucas
        -
          in: query
          name: active
          description: 'Filtrar por status ativo/inativo.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Filtrar por status ativo/inativo.'
            example: true
        -
          in: query
          name: per_page
          description: 'Itens por página (1-100, default: 25).'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Itens por página (1-100, default: 25).'
            example: 25
      responses:
        200:
          description: 'Lista de lojas'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'Mais Capinhas Tijucas'
                      city: Tijucas
                      active: true
                      users_count: 5
                      created_at: '2026-01-01T00:00:00Z'
                    -
                      id: 2
                      name: 'Mais Capinhas Itapema'
                      city: Itapema
                      active: true
                      users_count: 3
                  meta:
                    current_page: 1
                    per_page: 25
                    total: 3
                    last_page: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Mais Capinhas Tijucas'
                        city: Tijucas
                        active: true
                        users_count: 5
                        created_at: '2026-01-01T00:00:00Z'
                      -
                        id: 2
                        name: 'Mais Capinhas Itapema'
                        city: Itapema
                        active: true
                        users_count: 3
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Mais Capinhas Tijucas'
                        city:
                          type: string
                          example: Tijucas
                        active:
                          type: boolean
                          example: true
                        users_count:
                          type: integer
                          example: 5
                        created_at:
                          type: string
                          example: '2026-01-01T00:00:00Z'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 25
                      total:
                        type: integer
                        example: 3
                      last_page:
                        type: integer
                        example: 1
      tags:
        - 'Administração - Lojas'
    post:
      summary: 'Criar nova loja'
      operationId: criarNovaLoja
      description: "Cadastra uma nova loja (ponto de venda) no sistema.\n\nApós criar a loja, você deve:\n1. Vincular usuários à loja (via endpoint de vínculos)\n2. Configurar metas mensais (via `/goals/monthly`)\n3. Opcionalmente criar regras específicas de bônus/comissão\n\n**Quem pode usar:** Apenas administradores."
      parameters: []
      responses:
        201:
          description: 'Loja criada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 4
                    name: 'Mais Capinhas Shopping Center'
                    city: Florianópolis
                    active: true
                    created_at: '2026-01-07T17:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4
                      name:
                        type: string
                        example: 'Mais Capinhas Shopping Center'
                      city:
                        type: string
                        example: Florianópolis
                      active:
                        type: boolean
                        example: true
                      created_at:
                        type: string
                        example: '2026-01-07T17:00:00Z'
      tags:
        - 'Administração - Lojas'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nome identificador da loja.'
                  example: 'Mais Capinhas Shopping Center'
                city:
                  type: string
                  description: 'Cidade onde a loja está localizada.'
                  example: Florianópolis
                active:
                  type: boolean
                  description: 'Se a loja está ativa (default: true).'
                  example: true
