        - 'Administração - Vínculos Loja-Usuário'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: 'This field is required when <code>role</code> is not present. The <code>id</code> of an existing record in the users table.'
