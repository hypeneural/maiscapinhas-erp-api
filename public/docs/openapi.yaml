          required: false
          schema:
            type: integer
            description: 'ID da loja.'
            example: 1
        -
          in: query
          name: subject_type
          description: 'Tipo de entidade.'
          example: CashClosing
          required: false
          schema:
            type: string
            description: 'Tipo de entidade.'
            example: CashClosing
        -
          in: query
