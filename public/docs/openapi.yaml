  /api/v1/sales:
    get:
      summary: 'Listar vendas'
      operationId: listarVendas
      description: "Retorna a lista paginada de vendas das lojas às quais o\nusuário tem acesso, com diversos filtros disponíveis.\n\n**Visibilidade:**\n- Vendedor: vê vendas de todas as lojas onde trabalha\n- Gerente: vê todas as vendas das lojas que gerencia\n- Admin: vê todas as vendas do sistema\n\n**Filtros disponíveis:**\n- `store_id` - Filtrar por loja específica\n- `seller_id` - Filtrar por vendedor\n- `from`/`to` - Período de datas\n\n**Ordenação:** Por data de venda, mais recentes primeiro.\n\n**Quem pode usar:** Qualquer usuário autenticado (vê apenas suas lojas)."
      parameters:
        -
          in: query
          name: store_id
          description: 'Filtrar por loja (deve ter acesso).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filtrar por loja (deve ter acesso).'
            example: 1
        -
          in: query
          name: seller_id
          description: 'Filtrar por vendedor específico.'
          example: 6
          required: false
          schema:
            type: integer
            description: 'Filtrar por vendedor específico.'
            example: 6
        -
          in: query
          name: from
          description: 'Data inicial (YYYY-MM-DD).'
          example: '2026-01-01'
          required: false
          schema:
            type: string
            description: 'Data inicial (YYYY-MM-DD).'
            example: '2026-01-01'
        -
          in: query
          name: to
          description: 'Data final (YYYY-MM-DD).'
          example: '2026-01-31'
          required: false
          schema:
            type: string
            description: 'Data final (YYYY-MM-DD).'
            example: '2026-01-31'
        -
          in: query
          name: per_page
          description: 'Itens por página (1-100, default: 25).'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Itens por página (1-100, default: 25).'
            example: 25
      responses:
        200:
          description: 'Lista de vendas'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      store_id: 1
                      seller_id: 6
                      sold_at: '2026-01-07T10:30:00Z'
                      amount: 150.0
                      source: pdv
                      store:
                        id: 1
                        name: 'Mais Capinhas Tijucas'
                      seller:
                        id: 6
                        name: 'João Vendedor'
                  meta:
                    current_page: 1
                    per_page: 25
                    total: 150
                    last_page: 6
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        store_id: 1
                        seller_id: 6
                        sold_at: '2026-01-07T10:30:00Z'
                        amount: 150
                        source: pdv
                        store:
                          id: 1
                          name: 'Mais Capinhas Tijucas'
                        seller:
                          id: 6
                          name: 'João Vendedor'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        store_id:
                          type: integer
                          example: 1
                        seller_id:
                          type: integer
                          example: 6
                        sold_at:
                          type: string
                          example: '2026-01-07T10:30:00Z'
                        amount:
                          type: number
                          example: 150.0
                        source:
                          type: string
                          example: pdv
                        store:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 'Mais Capinhas Tijucas'
                        seller:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 6
                            name:
                              type: string
                              example: 'João Vendedor'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 25
                      total:
                        type: integer
                        example: 150
                      last_page:
                        type: integer
                        example: 6
        403:
          description: 'Loja sem acesso'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You do not have access to this store.'
                properties:
                  message:
                    type: string
                    example: 'You do not have access to this store.'
      tags:
        - Vendas
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the stores table.'
                  example: 16
                seller_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the users table.'
                  example: 16
                from:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-01-13T19:21:10'
                to:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-01-13T19:21:10'
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 22
    post:
      summary: 'Criar venda manual'
      operationId: criarVendaManual
      description: "Registra uma nova venda no sistema de forma manual.\n\n**Quando usar:**\n- Vendas feitas fora do PDV (dinheiro em espécie direto)\n- Correções de vendas não registradas\n- Vendas de quiosques sem sistema\n\n**Efeitos automáticos:**\nApós criar a venda, o sistema automaticamente dispara:\n1. `RecalculateSellerDailyBonusJob` - recalcula bônus do dia\n2. `RecalculateSellerMonthlyCommissionJob` - recalcula comissão do mês\n\n**Regras de Negócio:**\n- `store_id` deve ser uma loja onde o usuário tem acesso\n- `seller_id` default é o usuário logado\n- `source` default é \"manual\"\n- `amount` deve ser positivo\n\n**Quem pode usar:**\n- Vendedores (podem registrar próprias vendas)\n- Gerentes/Admins (podem registrar para qualquer vendedor)"
      parameters: []
      responses:
        201:
          description: 'Venda criada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 501
                    store_id: 1
                    seller_id: 6
                    sold_at: '2026-01-07T15:30:00Z'
                    amount: 175.5
                    source: manual
                    store:
                      id: 1
                      name: 'Mais Capinhas Tijucas'
                    seller:
                      id: 6
                      name: 'João Vendedor'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 501
                      store_id:
                        type: integer
                        example: 1
                      seller_id:
                        type: integer
                        example: 6
                      sold_at:
                        type: string
                        example: '2026-01-07T15:30:00Z'
                      amount:
                        type: number
                        example: 175.5
                      source:
                        type: string
                        example: manual
                      store:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Mais Capinhas Tijucas'
                      seller:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 6
                          name:
                            type: string
                            example: 'João Vendedor'
        403:
          description: 'Sem acesso à loja'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Você não tem acesso a esta loja.'
                properties:
                  message:
                    type: string
                    example: 'Você não tem acesso a esta loja.'
      tags:
        - Vendas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id:
                  type: integer
                  description: 'Loja onde a venda foi realizada.'
                  example: 1
                seller_id:
                  type: integer
                  description: 'Vendedor que realizou (default: você).'
                  example: 6
                sold_at:
                  type: string
                  description: 'Data/hora da venda (ISO 8601).'
                  example: '2026-01-07T15:30:00'
                amount:
                  type: number
                  description: 'Valor total da venda.'
                  example: 175.5
                source:
                  type: string
                  description: 'Origem: pdv, manual, import (default: manual).'
                  example: manual
              required:
                - store_id
                - sold_at
                - amount
  '/api/v1/sales/{id}':
    get:
      summary: 'Ver detalhes da venda'
      operationId: verDetalhesDaVenda
      description: "Retorna informações completas de uma venda específica.\n\n**Dados retornados:**\n- Informações básicas: `id`, `store_id`, `seller_id`, `sold_at`, `amount`, `source`\n- Loja: `store.id`, `store.name`\n- Vendedor: `seller.id`, `seller.name`\n- Timestamps: `created_at`, `updated_at`\n\n**Quem pode usar:** Usuários com acesso à loja da venda."
      parameters: []
      responses:
        200:
          description: 'Detalhes da venda'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    store_id: 1
                    seller_id: 6
                    sold_at: '2026-01-07T10:30:00Z'
                    amount: 150.0
                    source: pdv
                    created_at: '2026-01-07T10:31:00Z'
                    store:
                      id: 1
                      name: 'Mais Capinhas Tijucas'
                    seller:
                      id: 6
                      name: 'João Vendedor'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      store_id:
                        type: integer
                        example: 1
                      seller_id:
                        type: integer
                        example: 6
                      sold_at:
                        type: string
                        example: '2026-01-07T10:30:00Z'
                      amount:
                        type: number
                        example: 150.0
                      source:
                        type: string
                        example: pdv
                      created_at:
                        type: string
                        example: '2026-01-07T10:31:00Z'
                      store:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Mais Capinhas Tijucas'
                      seller:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 6
                          name:
                            type: string
                            example: 'João Vendedor'
      tags:
        - Vendas
    put:
      summary: 'Atualizar venda'
      operationId: atualizarVenda
      description: "Edita dados de uma venda existente.\n\n**Importante:**\nAlterações disparam recálculo automático de bônus e comissão\npara o vendedor afetado.\n\n**Casos de uso:**\n- Corrigir valor digitado errado\n- Ajustar data de venda\n- Corrigir fonte da venda\n\n**Regras de Negócio:**\n- Não é possível alterar `store_id` ou `seller_id` após criação\n- Apenas gerentes e admins podem editar vendas\n- Histórico de alterações é registrado para auditoria\n\n**Quem pode usar:** Gerentes e Admins da loja."
      parameters: []
      responses:
        200:
          description: 'Venda atualizada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    amount: 180.0
                    sold_at: '2026-01-07T16:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      amount:
                        type: number
                        example: 180.0
                      sold_at:
                        type: string
                        example: '2026-01-07T16:00:00Z'
        403:
          description: 'Sem permissão'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Apenas gerentes e admins podem editar vendas.'
                properties:
                  message:
                    type: string
                    example: 'Apenas gerentes e admins podem editar vendas.'
      tags:
        - Vendas
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sold_at:
                  type: string
                  description: 'Nova data/hora.'
                  example: '2026-01-07T16:00:00'
                amount:
                  type: number
                  description: 'Novo valor.'
                  example: 180.0
                source:
                  type: string
                  description: 'Nova origem: pdv, manual, import.'
                  example: pdv
    delete:
      summary: 'Excluir venda'
      operationId: excluirVenda
      description: "Remove permanentemente uma venda do sistema.\n\n**Atenção:**\n- Esta ação é **irreversível**\n- O bônus/comissão do vendedor será recalculado automaticamente\n- Recomendado documentar o motivo da exclusão\n\n**Casos de uso:**\n- Venda cadastrada em duplicidade\n- Venda cancelada pelo cliente\n- Teste registrado acidentalmente em produção\n\n**Regras de Negócio:**\n- Apenas administradores podem excluir vendas\n- A exclusão é registrada no log de auditoria\n\n**Quem pode usar:** Apenas Admins."
      parameters: []
      responses:
        200:
          description: 'Venda excluída'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    message: 'Venda excluída com sucesso.'
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Venda excluída com sucesso.'
        403:
          description: 'Sem permissão'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Apenas admins podem excluir vendas.'
                properties:
                  message:
                    type: string
                    example: 'Apenas admins podem excluir vendas.'
      tags:
        - Vendas
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the sale.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: sale
        description: 'ID da venda.'
        example: 1
        required: true
        schema:
          type: integer
