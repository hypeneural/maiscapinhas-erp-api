openapi: 3.0.3
info:
  title: 'MaisCapinhas ERP API - Documentação'
  description: 'API REST para gestão de vendas, metas, fechamento de caixa, bônus e comissões do ERP MaisCapinhas.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'Saúde & Versão'
    description: "\nEndpoints para verificação de saúde e status da API.\nEstes endpoints são públicos e não requerem autenticação."
  -
    name: Autenticação
    description: "\nEndpoints para autenticação via Bearer Token (Sanctum).\nA API suporta dois modos de autenticação:\n\n1. **Bearer Token** (recomendado para desenvolvimento e integrações)\n2. **Cookie SPA** (para frontends React/Vue com `withCredentials`)"
  -
    name: 'Perfil do Usuário'
    description: "\nEndpoint para obter informações do usuário autenticado."
  -
    name: Lojas
    description: "\nEndpoints para consultar lojas às quais o usuário tem acesso.\nO usuário só pode visualizar lojas onde está vinculado via `store_users`."
  -
    name: Dashboards
    description: "\nEndpoints de dashboard com métricas e KPIs por perfil de usuário.\nCada dashboard retorna informações personalizadas para o papel do usuário."
  -
    name: Vendas
    description: "\nEndpoints para consultar vendas registradas.\nVendas são registradas automaticamente via integração PDV ou manualmente."
  -
    name: 'Turnos de Caixa'
    description: "\nEndpoints para gerenciar turnos de caixa.\nCada turno representa um período de trabalho de um vendedor em uma loja."
  -
    name: 'Fechamento de Caixa'
    description: "\nEndpoints para gerenciar o fluxo de fechamento de caixa.\n\n**Workflow de Estados:**\n```\ndraft → submitted → approved\n                  → rejected → draft → ...\n```\n\n- `draft` - Rascunho (editável)\n- `submitted` - Enviado para conferência\n- `approved` - Aprovado (imutável)\n- `rejected` - Rejeitado (volta para draft para correção)"
  -
    name: 'Regras de Bônus'
    description: "\nGerenciamento de regras de bônus diário.\nRegras definem faixas de vendas mínimas e valores de bônus correspondentes.\n\n**Hierarquia de regras:**\n- Regra específica de loja (`store_id` preenchido) tem prioridade sobre regra global\n- Regra mais recente (`effective_from` maior) tem prioridade\n- Versionamento automático a cada atualização"
  -
    name: 'Regras de Comissão'
    description: "\nGerenciamento de regras de comissão mensal.\nRegras definem faixas de atingimento de meta e taxas de comissão.\n\n**Hierarquia de regras:**\n- Regra específica de loja tem prioridade sobre global\n- Comissão calculada: vendas × taxa (baseada no % de atingimento)"
  -
    name: 'Metas Mensais'
    description: "\nGerenciamento de metas mensais por loja e distribuição entre vendedores (splits).\nCada split define a porcentagem da meta que cada vendedor deve atingir.\n\n**Regra:** A soma dos splits deve ser exatamente 100%."
  -
    name: 'Extrato Financeiro'
    description: "\nEndpoints para consultar o extrato de bônus diário e comissão mensal.\nVendedores veem apenas seus próprios dados; gerentes/admins veem todos."
  -
    name: 'People Analytics'
    description: "\nEndpoints para consultar e inserir KPIs de fluxo de pessoas por turno.\nDados podem vir de sincronização com FastAPI ou inserção manual."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "    Para obter um token, faça login em `POST /api/v1/auth/login` com email e senha.\n\n    **Usuários de teste:**\n    - `admin@maiscapinhas.com.br` / `password` (Admin - todas as lojas)\n    - `joao.vendedor@maiscapinhas.com.br` / `password` (Vendedor - Tijucas)\n\n    O token deve ser enviado no header `Authorization: Bearer {token}`.\n\n    **Modo SPA (Cookie):** Para aplicações frontend, use `withCredentials: true` após obter o CSRF token em `/sanctum/csrf-cookie`."
security:
  -
    default: []
paths:
  /api/v1/health:
    get:
      summary: 'Verificar saúde da API'
      operationId: verificarSadeDaAPI
      description: "Retorna o status de saúde da API. Use este endpoint para\nverificar se a API está online e respondendo corretamente.\n\n**Casos de uso:**\n- Monitoramento de uptime (Uptime Robot, Pingdom, etc.)\n- Health checks em load balancers\n- Verificação de conectividade antes de operações\n\n**Resposta:**\n- `status: \"ok\"` - API funcionando normalmente\n- `timestamp` - Data/hora ISO 8601 da requisição"
      parameters: []
      responses:
        200:
          description: 'API saudável'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    status: ok
                    timestamp: '2026-01-07T12:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00+00:00'
      tags:
        - 'Saúde & Versão'
      security: []
  /api/v1/version:
    get:
      summary: 'Obter versão da API'
      operationId: obterVersoDaAPI
      description: "Retorna informações sobre a versão atual da API, incluindo\nversões do PHP e Laravel utilizadas.\n\n**Casos de uso:**\n- Verificar compatibilidade de versão antes de integrações\n- Debug e troubleshooting\n- Documentação técnica\n\n**Resposta:**\n- `name` - Nome da API\n- `api` - Versão da API (v1, v2, etc.)\n- `php` - Versão do PHP\n- `laravel` - Versão do Laravel"
      parameters: []
      responses:
        200:
          description: 'Versão atual'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    name: 'MaisCapinhas ERP API'
                    api: v1
                    php: 8.3.16
                    laravel: 12.45.2
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: 'MaisCapinhas ERP API'
                      api:
                        type: string
                        example: v1
                      php:
                        type: string
                        example: 8.3.16
                      laravel:
                        type: string
                        example: 12.45.2
      tags:
        - 'Saúde & Versão'
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Fazer login e obter token'
      operationId: fazerLoginEObterToken
      description: "Autentica o usuário e retorna um Bearer Token para uso nas próximas requisições.\n\n**Quem pode usar:** Qualquer usuário ativo com email e senha válidos.\n\n**Regras de negócio:**\n- Usuários inativos (`active = false`) não podem fazer login\n- O token não expira automaticamente, mas pode ser revogado via logout\n- Cada login gera um novo token (múltiplos dispositivos são permitidos)\n\n**Erros possíveis:**\n- `422` - Credenciais inválidas ou conta desativada"
      parameters: []
      responses:
        200:
          description: 'Login bem-sucedido'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    token: 1|abc123xyz...
                    token_type: Bearer
                    user:
                      id: 1
                      name: 'Admin Sistema'
                      email: admin@maiscapinhas.com.br
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|abc123xyz...
                      token_type:
                        type: string
                        example: Bearer
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Admin Sistema'
                          email:
                            type: string
                            example: admin@maiscapinhas.com.br
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Credenciais inválidas'
                    type: object
                    example:
                      message: 'The provided credentials are incorrect.'
                      errors:
                        email:
                          - 'The provided credentials are incorrect.'
                    properties:
                      message:
                        type: string
                        example: 'The provided credentials are incorrect.'
                      errors:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'The provided credentials are incorrect.'
                            items:
                              type: string
                  -
                    description: 'Conta desativada'
                    type: object
                    example:
                      message: 'This account is deactivated.'
                      errors:
                        email:
                          - 'This account is deactivated.'
                    properties:
                      message:
                        type: string
                        example: 'This account is deactivated.'
                      errors:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'This account is deactivated.'
                            items:
                              type: string
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email do usuário.'
                  example: admin@maiscapinhas.com.br
                password:
                  type: string
                  description: 'Senha do usuário.'
                  example: password
                device_name:
                  type: string
                  description: 'Nome do dispositivo (opcional, usado para identificar tokens).'
                  example: postman-dev
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Fazer logout (revogar token atual)'
      operationId: fazerLogoutrevogarTokenAtual
      description: "Revoga o token que foi usado para autenticar esta requisição.\nOs demais tokens do usuário (outros dispositivos) permanecem válidos.\n\n**Quem pode usar:** Qualquer usuário autenticado.\n\n**Casos de uso:**\n- Logout manual do usuário\n- Encerrar sessão em um dispositivo específico"
      parameters: []
      responses:
        200:
          description: 'Logout bem-sucedido'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    message: 'Successfully logged out.'
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Successfully logged out.'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
      tags:
        - Autenticação
  /api/v1/auth/logout-all:
    post:
      summary: 'Revogar todos os tokens'
      operationId: revogarTodosOsTokens
      description: "Revoga **todos** os tokens do usuário, desconectando-o de todos os dispositivos.\n\n**Quem pode usar:** Qualquer usuário autenticado.\n\n**Casos de uso:**\n- Suspeita de comprometimento de segurança\n- Forçar re-login em todos os dispositivos\n- Alteração de senha"
      parameters: []
      responses:
        200:
          description: 'Todos tokens revogados'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    message: 'All tokens revoked.'
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'All tokens revoked.'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
      tags:
        - Autenticação
  /api/v1/me:
    get:
      summary: 'Obter perfil do usuário atual'
      operationId: obterPerfilDoUsurioAtual
      description: "Retorna os dados do usuário autenticado, incluindo as lojas\nàs quais ele tem acesso e seu papel (role) em cada uma.\n\n**Quem pode usar:** Qualquer usuário autenticado.\n\n**Informações retornadas:**\n- Dados básicos do usuário (id, nome, email, status ativo)\n- Lista de lojas com o papel do usuário em cada uma\n\n**Papéis possíveis:**\n- `admin` - Administrador global (acesso total)\n- `gerente` - Gerente da loja (gerencia vendedores e metas)\n- `conferente` - Confere fechamentos de caixa\n- `vendedor` - Vendedor (registra vendas e turnos)"
      parameters: []
      responses:
        200:
          description: 'Perfil com múltiplas lojas'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    user:
                      id: 1
                      name: 'Admin Sistema'
                      email: admin@maiscapinhas.com.br
                      active: true
                      created_at: '2026-01-01T00:00:00+00:00'
                    stores:
                      -
                        id: 1
                        name: 'Mais Capinhas Tijucas'
                        city: Tijucas
                        role: admin
                      -
                        id: 2
                        name: 'Mais Capinhas Itapema'
                        city: Itapema
                        role: admin
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Admin Sistema'
                          email:
                            type: string
                            example: admin@maiscapinhas.com.br
                          active:
                            type: boolean
                            example: true
                          created_at:
                            type: string
                            example: '2026-01-01T00:00:00+00:00'
                      stores:
                        type: array
                        example:
                          -
                            id: 1
                            name: 'Mais Capinhas Tijucas'
                            city: Tijucas
                            role: admin
                          -
                            id: 2
                            name: 'Mais Capinhas Itapema'
                            city: Itapema
                            role: admin
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 'Mais Capinhas Tijucas'
                            city:
                              type: string
                              example: Tijucas
                            role:
                              type: string
                              example: admin
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
      tags:
        - 'Perfil do Usuário'
  /api/v1/stores:
    get:
      summary: 'Listar lojas do usuário'
      operationId: listarLojasDoUsurio
      description: "Retorna todas as lojas ativas às quais o usuário autenticado tem acesso.\nCada loja inclui o papel (role) do usuário naquela loja.\n\n**Quem pode usar:** Qualquer usuário autenticado.\n\n**Regras:**\n- Apenas lojas ativas (`active = true`) são retornadas\n- Apenas lojas onde o usuário está vinculado são listadas"
      parameters: []
      responses:
        200:
          description: 'Lista de lojas'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'Mais Capinhas Tijucas'
                      city: Tijucas
                      role: admin
                    -
                      id: 2
                      name: 'Mais Capinhas Itapema'
                      city: Itapema
                      role: gerente
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Mais Capinhas Tijucas'
                        city: Tijucas
                        role: admin
                      -
                        id: 2
                        name: 'Mais Capinhas Itapema'
                        city: Itapema
                        role: gerente
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Mais Capinhas Tijucas'
                        city:
                          type: string
                          example: Tijucas
                        role:
                          type: string
                          example: admin
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
      tags:
        - Lojas
  '/api/v1/stores/{id}':
    get:
      summary: 'Obter detalhes de uma loja'
      operationId: obterDetalhesDeUmaLoja
      description: "Retorna os detalhes de uma loja específica, se o usuário tiver acesso.\n\n**Quem pode usar:** Usuários com vínculo na loja.\n\n**Erros possíveis:**\n- `403` - Usuário não tem acesso a esta loja\n- `404` - Loja não encontrada"
      parameters: []
      responses:
        200:
          description: 'Loja encontrada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Mais Capinhas Tijucas'
                    city: Tijucas
                    active: true
                    role: admin
                    created_at: '2026-01-01T00:00:00+00:00'
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Mais Capinhas Tijucas'
                      city:
                        type: string
                        example: Tijucas
                      active:
                        type: boolean
                        example: true
                      role:
                        type: string
                        example: admin
                      created_at:
                        type: string
                        example: '2026-01-01T00:00:00+00:00'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
        403:
          description: 'Sem acesso'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: 403
                    message: 'You do not have access to this store.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 403
                      message:
                        type: string
                        example: 'You do not have access to this store.'
      tags:
        - Lojas
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the store.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: store
        description: 'ID da loja.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/dashboard/vendedor:
    get:
      summary: 'Dashboard do Vendedor'
      operationId: dashboardDoVendedor
      description: "Retorna métricas do vendedor no dia, incluindo suas vendas pessoais\ncomparadas com o total da loja e status dos seus turnos.\n\n**Quem pode usar:** Vendedores e níveis superiores.\n\n**Métricas retornadas:**\n- `my_sales` - Quantidade e valor total das vendas do vendedor no dia\n- `store_sales` - Quantidade e valor total de todas as vendas da loja no dia\n- `my_shifts` - Lista dos turnos do vendedor naquele dia com status do fechamento\n\n**Dica:** Compare `my_sales` com `store_sales` para ver sua participação nas vendas da loja."
      parameters:
        -
          in: query
          name: store_id
          description: 'ID da loja.'
          example: 1
          required: true
          schema:
            type: integer
            description: 'ID da loja.'
            example: 1
        -
          in: query
          name: date
          description: 'Data no formato YYYY-MM-DD (padrão: hoje).'
          example: '2026-01-07'
          required: false
          schema:
            type: string
            description: 'Data no formato YYYY-MM-DD (padrão: hoje).'
            example: '2026-01-07'
      responses:
        200:
          description: 'Vendas do dia'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    date: '2026-01-07'
                    my_sales:
                      count: 5
                      total: 850.0
                    store_sales:
                      count: 23
                      total: 3200.0
                    my_shifts:
                      -
                        id: 1
                        date: '2026-01-07'
                        shift_code: M
                        status: open
                        cash_closing: null
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      date:
                        type: string
                        example: '2026-01-07'
                      my_sales:
                        type: object
                        properties:
                          count:
                            type: integer
                            example: 5
                          total:
                            type: number
                            example: 850.0
                      store_sales:
                        type: object
                        properties:
                          count:
                            type: integer
                            example: 23
                          total:
                            type: number
                            example: 3200.0
                      my_shifts:
                        type: array
                        example:
                          -
                            id: 1
                            date: '2026-01-07'
                            shift_code: M
                            status: open
                            cash_closing: null
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            date:
                              type: string
                              example: '2026-01-07'
                            shift_code:
                              type: string
                              example: M
                            status:
                              type: string
                              example: open
                            cash_closing:
                              type: string
                              example: null
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
        403:
          description: 'Sem acesso à loja'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: 403
                    message: 'You do not have access to this store.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 403
                      message:
                        type: string
                        example: 'You do not have access to this store.'
      tags:
        - Dashboards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the stores table.'
                  example: 16
                date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-01-07T19:59:14'
              required:
                - store_id
  /api/v1/dashboard/conferente:
    get:
      summary: 'Dashboard do Conferente'
      operationId: dashboardDoConferente
      description: "Retorna métricas para conferência de caixa, incluindo fechamentos\npendentes de aprovação e ranking de vendedores.\n\n**Quem pode usar:** Conferentes, Gerentes e Admins.\n\n**Métricas retornadas:**\n- `pending_closings` - Lista de fechamentos aguardando aprovação/rejeição\n- `pending_count` - Quantidade de fechamentos pendentes\n- `store_sales` - Total de vendas da loja no dia\n- `shifts_today` - Resumo de turnos por status (open, closed, pending)\n- `top_sellers` - Top 5 vendedores do dia por valor vendido"
      parameters:
        -
          in: query
          name: store_id
          description: 'ID da loja.'
          example: 1
          required: true
          schema:
            type: integer
            description: 'ID da loja.'
            example: 1
        -
          in: query
          name: date
          description: 'Data no formato YYYY-MM-DD (padrão: hoje).'
          example: '2026-01-07'
          required: false
          schema:
            type: string
            description: 'Data no formato YYYY-MM-DD (padrão: hoje).'
            example: '2026-01-07'
      responses:
        200:
          description: 'Dashboard do conferente'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    date: '2026-01-07'
                    pending_closings: []
                    pending_count: 0
                    store_sales:
                      count: 23
                      total: 3200.0
                    shifts_today:
                      open: 2
                      closed: 4
                    top_sellers:
                      -
                        seller_id: 6
                        name: 'João Vendedor'
                        total: 1500.0
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
