      responses:
        200:
          description: 'Itens recusados'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: '2 item(ns) recusado(s) com sucesso.'
                  data:
                    id: 1
                    total_itens: 8
                    rejected_count: 2
                properties:
                  message:
                    type: string
                    example: '2 item(ns) recusado(s) com sucesso.'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      total_itens:
                        type: integer
                        example: 8
                      rejected_count:
                        type: integer
                        example: 2
        422:
          description: 'Status inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Itens não podem ser recusados no status atual.'
                properties:
                  message:
                    type: string
                    example: 'Itens não podem ser recusados no status atual.'
      tags:
        - 'Fábrica - Pedidos de Produção'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rejections:
                  type: object
                  description: 'Mapa de item_id => motivo da recusa.'
                  example: []
                  properties:
                    '*':
                      type: string
                      description: 'Motivo da recusa para o item.'
                      example: 'Imagem com baixa resolução'
              required:
                - rejections
