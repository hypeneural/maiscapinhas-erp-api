                      active: true
                      whatsapp: '47988887777'
                      avatar_url: 'https://example.com/avatar.jpg'
                      instagram: '@maiscapinhas'
                      birth_date: '1990-05-15'
                      hire_date: '2022-01-09'
                      created_at: '2026-01-01T00:00:00+00:00'
                    stores:
                      -
                        id: 1
                        name: 'Mais Capinhas Tijucas'
                        city: Tijucas
                        role: admin
                  meta:
                    timestamp: '2026-01-10T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Admin Sistema'
                          email:
                            type: string
                            example: novoemail@maiscapinhas.com.br
                          active:
                            type: boolean
                            example: true
                          whatsapp:
                            type: string
                            example: '47988887777'
                          avatar_url:
                            type: string
                            example: 'https://example.com/avatar.jpg'
                          instagram:
                            type: string
                            example: '@maiscapinhas'
                          birth_date:
                            type: string
                            example: '1990-05-15'
                          hire_date:
                            type: string
                            example: '2022-01-09'
                          created_at:
                            type: string
                            example: '2026-01-01T00:00:00+00:00'
                      stores:
                        type: array
                        example:
