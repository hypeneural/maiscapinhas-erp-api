                - name
                - email
                - password
  '/api/v1/admin/users/{id}':
    get:
      summary: 'Ver detalhes do usuário'
      operationId: verDetalhesDoUsurio
      description: "Retorna informações completas de um usuário específico,\nincluindo todas as lojas vinculadas e suas respectivas roles.\n\nÚtil para:\n- Verificar acessos do usuário\n- Editar informações\n- Auditar permissões\n\n**Quem pode usar:** Apenas administradores.\n\n**Dados retornados:**\n- `id`, `name`, `email`, `active`, `created_at`, `updated_at`\n- `stores[]` - array de lojas com role em cada uma"
      parameters: []
      responses:
        200:
          description: 'Detalhes do usuário'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 6
                    name: 'João Vendedor'
                    email: joao.vendedor@maiscapinhas.com.br
                    active: true
                    created_at: '2026-01-01T00:00:00Z'
                    updated_at: '2026-01-07T12:00:00Z'
                    stores:
                      -
                        store_id: 1
                        store_name: 'Mais Capinhas Tijucas'
                        role: vendedor
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 6
                      name:
                        type: string
                        example: 'João Vendedor'
                      email:
                        type: string
                        example: joao.vendedor@maiscapinhas.com.br
                      active:
                        type: boolean
                        example: true
                      created_at:
                        type: string
                        example: '2026-01-01T00:00:00Z'
                      updated_at:
                        type: string
                        example: '2026-01-07T12:00:00Z'
                      stores:
                        type: array
                        example:
                          -
                            store_id: 1
                            store_name: 'Mais Capinhas Tijucas'
                            role: vendedor
                        items:
                          type: object
                          properties:
                            store_id:
                              type: integer
                              example: 1
                            store_name:
                              type: string
                              example: 'Mais Capinhas Tijucas'
                            role:
                              type: string
                              example: vendedor
        404:
          description: 'Usuário não encontrado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\User] 999'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\User] 999'
      tags:
        - 'Administração - Usuários'
    put:
      summary: 'Atualizar usuário'
      operationId: atualizarUsurio
      description: "Atualiza dados cadastrais de um usuário existente.\nApenas os campos informados serão alterados.\n\n**Casos de uso:**\n- Corrigir nome ou email\n- Alterar senha\n- Ativar/desativar usuário\n\n**Regras de Negócio:**\n- Email deve continuar único (validação considera o próprio usuário)\n- Para gerenciar vínculos com lojas, use os endpoints de vínculos\n\n**Quem pode usar:** Apenas administradores."
      parameters: []
      responses:
        200:
          description: 'Usuário atualizado'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 6
                    name: 'João da Silva Atualizado'
                    email: joao.vendedor@maiscapinhas.com.br
                    active: true
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 6
                      name:
                        type: string
                        example: 'João da Silva Atualizado'
                      email:
                        type: string
                        example: joao.vendedor@maiscapinhas.com.br
                      active:
                        type: boolean
                        example: true
      tags:
        - 'Administração - Usuários'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Novo nome completo.'
                  example: 'João da Silva Atualizado'
                email:
                  type: string
                  description: 'Novo email (deve ser único).'
                  example: joao.novo@maiscapinhas.com.br
                password:
                  type: string
                  description: 'Nova senha (mínimo 8 caracteres).'
                  example: novasenha123
                active:
                  type: boolean
                  description: 'Ativar (true) ou desativar (false).'
                  example: true
    delete:
      summary: 'Desativar usuário'
      operationId: desativarUsurio
      description: "Define o usuário como inativo (`active = false`) e revoga\ntodos os tokens de acesso, forçando logout imediato.\n\n**Importante:**\n- Não exclui o usuário do banco (soft disable)\n- Dados históricos são mantidos para auditoria\n- Usuário pode ser reativado posteriormente via PUT\n\n**Regras de Negócio:**\n- Não é possível desativar seu próprio usuário (proteção)\n- Usuários desativados não conseguem fazer login\n- Tokens existentes são invalidados imediatamente\n\n**Quem pode usar:** Apenas administradores."
      parameters: []
      responses:
        200:
          description: 'Usuário desativado'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    message: 'Usuário desativado com sucesso.'
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Usuário desativado com sucesso.'
        403:
          description: 'Tentativa de auto-desativação'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Você não pode desativar seu próprio usuário.'
                properties:
                  message:
                    type: string
                    example: 'Você não pode desativar seu próprio usuário.'
      tags:
        - 'Administração - Usuários'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the user.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: user
        description: 'ID do usuário.'
        example: 6
        required: true
        schema:
          type: integer
  '/api/v1/admin/stores/{store_id}/users':
    get:
      summary: 'Listar usuários de uma loja'
      operationId: listarUsuriosDeUmaLoja
      description: "Retorna todos os usuários vinculados a uma loja específica,\ncom suas respectivas roles e status.\n\n**Dados retornados por vínculo:**\n- `user_id` - ID do usuário\n- `user_name` - Nome do usuário\n- `user_email` - Email do usuário\n- `user_active` - Se o usuário está ativo\n- `role` - Role do usuário nesta loja\n- `created_at` - Quando o vínculo foi criado\n\n**Quem pode usar:** Apenas administradores."
      parameters: []
      responses:
        200:
          description: 'Usuários da loja'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      user_id: 2
                      user_name: 'Carlos Gerente'
                      user_email: carlos.gerente@maiscapinhas.com.br
                      user_active: true
                      role: gerente
                      created_at: '2026-01-01T00:00:00Z'
                    -
                      user_id: 6
                      user_name: 'João Vendedor'
                      user_email: joao.vendedor@maiscapinhas.com.br
                      user_active: true
                      role: vendedor
                      created_at: '2026-01-01T00:00:00Z'
                properties:
                  data:
                    type: array
                    example:
                      -
                        user_id: 2
                        user_name: 'Carlos Gerente'
                        user_email: carlos.gerente@maiscapinhas.com.br
                        user_active: true
                        role: gerente
                        created_at: '2026-01-01T00:00:00Z'
                      -
                        user_id: 6
                        user_name: 'João Vendedor'
                        user_email: joao.vendedor@maiscapinhas.com.br
                        user_active: true
                        role: vendedor
                        created_at: '2026-01-01T00:00:00Z'
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                          example: 2
                        user_name:
                          type: string
                          example: 'Carlos Gerente'
                        user_email:
                          type: string
                          example: carlos.gerente@maiscapinhas.com.br
                        user_active:
                          type: boolean
                          example: true
                        role:
                          type: string
                          example: gerente
                        created_at:
                          type: string
                          example: '2026-01-01T00:00:00Z'
      tags:
        - 'Administração - Vínculos Loja-Usuário'
    post:
      summary: 'Vincular usuário a loja'
      operationId: vincularUsurioALoja
      description: "Cria um novo vínculo entre um usuário existente e uma loja,\ndefinindo qual role esse usuário terá nessa loja.\n\n**Casos de uso:**\n- Adicionar novo vendedor à equipe de uma loja\n- Promover funcionário a gerente em determinada loja\n- Configurar vendedor \"volante\" para trabalhar temporariamente\n\n**Regras de Negócio:**\n- Um usuário só pode ter um vínculo por loja (unique: store_id + user_id)\n- Para alterar a role, use PUT\n- O usuário deve existir previamente (criar via POST /admin/users)\n\n**Quem pode usar:** Apenas administradores."
      parameters: []
      responses:
        201:
          description: 'Vínculo criado'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    user_id: 8
                    store_id: 1
                    role: vendedor
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 8
                      store_id:
                        type: integer
                        example: 1
                      role:
                        type: string
                        example: vendedor
        422:
          description: 'Usuário já vinculado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    user_id:
                      - 'Este usuário já está vinculado a esta loja.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      user_id:
                        type: array
                        example:
                          - 'Este usuário já está vinculado a esta loja.'
                        items:
                          type: string
      tags:
        - 'Administração - Vínculos Loja-Usuário'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: 'ID do usuário a vincular.'
                  example: 8
                role:
                  type: string
                  description: 'Role: admin, gerente, conferente ou vendedor.'
                  example: vendedor
              required:
                - user_id
                - role
    parameters:
      -
        in: path
        name: store_id
        description: 'The ID of the store.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: store
        description: 'ID da loja.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/stores/{store_id}/users/{id}':
    put:
      summary: 'Atualizar role do usuário na loja'
      operationId: atualizarRoleDoUsurioNaLoja
      description: "Altera a role de um usuário em uma loja específica.\n\n**Casos de uso:**\n- Promover vendedor a conferente\n- Rebaixar gerente a conferente\n- Dar acesso admin a um gerente\n\n**Quem pode usar:** Apenas administradores."
      parameters: []
      responses:
        200:
          description: 'Role atualizada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    user_id: 6
                    store_id: 1
                    role: gerente
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 6
                      store_id:
                        type: integer
                        example: 1
                      role:
                        type: string
                        example: gerente
        404:
          description: 'Vínculo não existe'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Usuário não está vinculado a esta loja.'
