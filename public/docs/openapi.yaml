                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        example: true
                      message_id:
                        type: string
                        example: 3EB0C767D097B3C5C12345
                      provider_data:
                        type: object
                        properties:
                          key:
                            type: object
                            properties:
                              id:
                                type: string
                                example: ...
