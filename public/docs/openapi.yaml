  '/api/v1/admin/modules/{module_id}/config':
    get:
      summary: 'Get module config with schema.'
      operationId: getModuleConfigWithSchema
      description: "Returns the current configuration values, default values, and a dynamic schema\nthat describes each configurable field. The schema is organized in sections\n(e.g., notifications, deadlines, requirements) with field types and validation rules.\n\n**Schema Structure:**\n- `sections`: Grouped configuration fields by category\n- `sections.{key}.fields`: Individual field definitions with type, label, hint, options\n- `defaults`: Default values for all fields\n\n**Field Types:**\n- `switch`: Boolean toggle\n- `number`: Integer with min/max\n- `select`: Dropdown with predefined options\n- `text`/`textarea`: String input\n\n**Conditional Fields:**\nFields with `depends_on` should only be shown when the referenced field is true."
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  module_id: pedidos-simples
                  module_name: 'Pedidos Simples'
                  config:
                    notify_on_status_change: false
                    notification_channel: whatsapp
                    warning_after_days: 5
                    auto_cancel_days: 20
                    require_customer_phone: true
                    require_notes: false
                  schema:
                    sections:
                      notifications:
                        label: Notificações
                        icon: Bell
                        description: 'Configurações de notificação ao cliente'
                        fields:
                          notify_on_status_change:
                            type: switch
                            label: 'Notificar ao mudar status'
                            hint: 'Enviar notificação WhatsApp quando o status mudar'
                            default: false
                          notification_channel:
                            type: select
                            label: 'Canal de notificação'
                            options:
                              whatsapp: WhatsApp
                              email: E-mail
                              both: Ambos
                            default: whatsapp
                            depends_on: notify_on_status_change
                    defaults: {  }
                  has_custom_config: false
                properties:
                  module_id:
                    type: string
                    example: pedidos-simples
                    description: 'The module identifier.'
                    enum: []
                  module_name:
                    type: string
                    example: 'Pedidos Simples'
                    description: 'Human-readable module name.'
                    enum: []
                  config:
                    type: object
                    properties:
                      notify_on_status_change:
                        type: boolean
                        example: false
                      notification_channel:
                        type: string
                        example: whatsapp
                      warning_after_days:
                        type: integer
                        example: 5
                      auto_cancel_days:
                        type: integer
                        example: 20
                      require_customer_phone:
                        type: boolean
                        example: true
                      require_notes:
                        type: boolean
                        example: false
                    description: 'Current merged configuration (defaults + custom).'
                  schema:
                    type: object
                    properties:
                      sections:
                        type: object
                        properties:
                          notifications:
                            type: object
                            properties:
                              label:
                                type: string
                                example: Notificações
                              icon:
                                type: string
                                example: Bell
                              description:
                                type: string
                                example: 'Configurações de notificação ao cliente'
                              fields:
                                type: object
                                properties:
                                  notify_on_status_change:
                                    type: object
                                    properties:
                                      type: { type: string, example: switch }
                                      label: { type: string, example: 'Notificar ao mudar status' }
                                      hint: { type: string, example: 'Enviar notificação WhatsApp quando o status mudar' }
                                      default: { type: boolean, example: false }
                                  notification_channel:
                                    type: object
                                    properties:
                                      type: { type: string, example: select }
                                      label: { type: string, example: 'Canal de notificação' }
                                      options: { type: object, properties: { whatsapp: { type: string, example: WhatsApp }, email: { type: string, example: E-mail }, both: { type: string, example: Ambos } } }
                                      default: { type: string, example: whatsapp }
                                      depends_on: { type: string, example: notify_on_status_change }
                      defaults:
                        type: object
                        properties: {  }
                    description: 'Dynamic schema for UI rendering with sections and field definitions.'
                  has_custom_config:
                    type: boolean
                    example: false
                    description: 'Whether any custom config has been saved.'
                    enum: []
        404:
          description: 'module not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Módulo não encontrado.'
                properties:
                  message:
                    type: string
                    example: 'Módulo não encontrado.'
      tags:
        - 'Admin - Modules'
    patch:
      summary: 'Update module config.'
      operationId: updateModuleConfig
      description: "Updates the global configuration for a module. Only fields defined in the\nmodule's config schema can be updated. Validation is automatically applied\nbased on field types (switch=boolean, number=integer with min/max, etc.).\n\nThe update is merged with existing config, so you only need to send changed fields.\nAll changes are logged in the module's audit log."
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Configurações atualizadas.'
                  config:
                    notify_on_status_change: true
                    notification_channel: whatsapp
                    warning_after_days: 3
                    auto_cancel_days: 20
                    require_customer_phone: true
                    require_notes: false
                properties:
                  message:
                    type: string
                    example: 'Configurações atualizadas.'
                  config:
                    type: object
                    properties:
                      notify_on_status_change:
                        type: boolean
                        example: true
                      notification_channel:
                        type: string
                        example: whatsapp
                      warning_after_days:
                        type: integer
                        example: 3
                      auto_cancel_days:
                        type: integer
                        example: 20
                      require_customer_phone:
                        type: boolean
                        example: true
                      require_notes:
                        type: boolean
                        example: false
        404:
          description: 'module not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Módulo não encontrado.'
                properties:
                  message:
                    type: string
                    example: 'Módulo não encontrado.'
        422:
          description: 'validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The warning_after_days field must be at least 1.'
                properties:
                  message:
                    type: string
                    example: 'The warning_after_days field must be at least 1.'
      tags:
        - 'Admin - Modules'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notify_on_status_change:
                  type: boolean
                  description: 'Enable status change notifications.'
                  example: true
                notification_channel:
                  type: string
                  description: 'Notification channel: whatsapp, email, or both.'
                  example: whatsapp
                warning_after_days:
                  type: integer
                  description: 'Days before warning alert (1-60).'
                  example: 3
                auto_cancel_days:
                  type: integer
                  description: 'Days before auto-cancel (0-90, 0=disabled).'
                  example: 20
                require_customer_phone:
                  type: boolean
                  description: 'Require customer phone on creation.'
                  example: true
                require_notes:
                  type: boolean
                  description: 'Require notes field.'
                  example: false
    parameters:
      -
        in: path
        name: module_id
        description: 'The ID of the module.'
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: module
        description: 'The module ID.'
        example: pedidos-simples
        required: true
        schema:
          type: string
