  /api/v1/dashboard/vendedor:
    get:
      summary: 'Dashboard do Vendedor'
      operationId: dashboardDoVendedor
      description: "Retorna métricas completas para o vendedor, incluindo:\n- Vendas pessoais do dia\n- **Gamificação de Bônus** - quanto falta para o próximo nível\n- **Projeção de Comissão** - tier atual e potencial\n- **Pace Diário** - ritmo comparado à média\n\nEste dashboard é projetado para **motivar** o vendedor mostrando\nmetas tangíveis e progresso em tempo real.\n\n**Quem pode usar:** Vendedores e níveis superiores.\n\n**Métricas retornadas:**\n| Métrica | Descrição |\n|---------|-----------|\n| `my_sales` | Quantidade e valor total das vendas do dia |\n| `store_sales` | Total de vendas da loja (para comparação) |\n| `bonus_gamification` | Gap para próximo bônus, bônus atual |\n| `monthly_commission` | Tier atual, projeção, potencial |\n| `daily_pace` | Ritmo vs média diária |\n| `my_shifts` | Turnos do dia com status |"
      parameters:
        -
          in: query
          name: store_id
          description: 'ID da loja.'
          example: 1
          required: true
          schema:
            type: integer
            description: 'ID da loja.'
            example: 1
        -
          in: query
          name: date
          description: 'Data (YYYY-MM-DD), default: hoje.'
          example: '2026-01-07'
          required: false
          schema:
            type: string
            description: 'Data (YYYY-MM-DD), default: hoje.'
            example: '2026-01-07'
      responses:
        200:
          description: 'Dashboard completo'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    date: '2026-01-07'
                    my_sales:
                      count: 5
                      total: 450.0
                    store_sales:
                      count: 23
                      total: 3200.0
                    bonus_gamification:
                      current_amount: 450.0
                      next_bonus_goal: 500.0
                      gap_to_bonus: 50.0
                      next_bonus_value: 10.0
                      current_bonus_earned: 0
                      message: 'Faltam R$ 50,00 para ganhar R$ 10,00 de bônus!'
                    monthly_commission:
                      sales_mtd: 8500.0
                      goal_amount: 15000.0
                      achievement_rate: 56.67
                      current_tier: 2.0
                      current_commission_value: 170.0
                      next_tier: 3.0
                      potential_commission: 450.0
                    daily_pace:
                      today_sales: 450.0
                      average_daily_sales: 566.67
                      today_vs_average: -116.67
                      status: BEHIND
                    my_shifts: []
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
