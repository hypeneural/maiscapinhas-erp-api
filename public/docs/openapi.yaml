                      next_bonus_value: 10.0
                      current_bonus_earned: 0
                      message: 'Faltam R$ 50,00 para ganhar R$ 10,00 de bônus!'
                    monthly_commission:
                      sales_mtd: 8500.0
                      goal_amount: 15000.0
                      achievement_rate: 56.67
                      current_tier: 2.0
                      current_commission_value: 170.0
                      next_tier: 3.0
                      potential_commission: 450.0
                    daily_pace:
                      today_sales: 450.0
                      average_daily_sales: 566.67
                      today_vs_average: -116.67
                      status: BEHIND
                    my_shifts: []
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      date:
                        type: string
                        example: '2026-01-07'
                      my_sales:
                        type: object
                        properties:
                          count:
                            type: integer
                            example: 5
                          total:
                            type: number
                            example: 450.0
                      store_sales:
                        type: object
                        properties:
                          count:
                            type: integer
                            example: 23
                          total:
                            type: number
                            example: 3200.0
                      bonus_gamification:
                        type: object
                        properties:
                          current_amount:
                            type: number
                            example: 450.0
                          next_bonus_goal:
                            type: number
                            example: 500.0
                          gap_to_bonus:
                            type: number
                            example: 50.0
                          next_bonus_value:
                            type: number
                            example: 10.0
                          current_bonus_earned:
                            type: integer
                            example: 0
                          message:
                            type: string
                            example: 'Faltam R$ 50,00 para ganhar R$ 10,00 de bônus!'
                      monthly_commission:
                        type: object
                        properties:
                          sales_mtd:
                            type: number
                            example: 8500.0
                          goal_amount:
                            type: number
                            example: 15000.0
                          achievement_rate:
                            type: number
                            example: 56.67
                          current_tier:
                            type: number
                            example: 2.0
