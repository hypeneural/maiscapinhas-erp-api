                    title: 'Manutenção Programada'
                    status: draft
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      title:
                        type: string
                        example: 'Manutenção Programada'
                      status:
                        type: string
                        example: draft
