                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Vínculo removido com sucesso.'
        403:
          description: 'Tentativa de auto-remoção'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Você não pode remover seu próprio vínculo.'
                properties:
                  message:
                    type: string
                    example: 'Você não pode remover seu próprio vínculo.'
        404:
          description: 'Vínculo não encontrado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Vínculo não encontrado.'
                properties:
                  message:
                    type: string
                    example: 'Vínculo não encontrado.'
      tags:
        - 'Administração - Vínculos Loja-Usuário'
    parameters:
      -
        in: path
        name: store_id
        description: 'The ID of the store.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: id
        description: 'The ID of the user.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: store
        description: 'ID da loja.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: user
        description: 'ID do usuário no vínculo.'
        example: 6
        required: true
        schema:
          type: integer
