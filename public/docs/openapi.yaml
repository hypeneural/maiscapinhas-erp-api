openapi: 3.0.3
info:
  title: 'MaisCapinhas ERP API - Documentação'
  description: 'API REST para gestão de vendas, metas, fechamento de caixa, bônus e comissões do ERP MaisCapinhas.'
  version: 1.0.0
servers:
  -
    url: 'https://api.maiscapinhas.com.br'
tags:
  -
    name: 'Saúde & Versão'
    description: "\nEndpoints para verificação de saúde e status da API.\nEstes endpoints são públicos e não requerem autenticação."
  -
    name: Autenticação
    description: "\nEndpoints para autenticação via Bearer Token (Sanctum).\nA API suporta dois modos de autenticação:\n\n1. **Bearer Token** (recomendado para desenvolvimento e integrações)\n2. **Cookie SPA** (para frontends React/Vue com `withCredentials`)\n\n**Auditoria:** Todas as ações de autenticação (login, logout) são\nregistradas no log de auditoria com IP e user-agent."
  -
    name: 'Perfil do Usuário'
    description: "\nEndpoints para obter e atualizar informações do usuário autenticado."
  -
    name: Lojas
    description: "\nEndpoints para consultar lojas às quais o usuário tem acesso.\nO usuário só pode visualizar lojas onde está vinculado via `store_users`."
  -
    name: 'PDV - Sync'
    description: "\nEndpoint de ingestao do webhook PDV Sync Agent v3.\n\nContrato:\n- `schema_version` suportado: `3.0`\n- idempotencia por `integrity.sync_id`\n- payload validado por regras Laravel + JSON Schema\n- enfileiramento assincorno para processamento (`ProcessPdvSyncJob`)\n\nSeguranca:\n- Middleware custom `pdv.signature`\n- Pode operar em modo HMAC, Bearer, Auto ou None (controlado por `config('pdv.*')`)"
  -
    name: 'PDV - Relatorios'
    description: "\nEndpoints de consulta e analytics do PDV Sync v3.\n\nEscopo:\n- Vendas por periodo, vendedor, canal, turno e meio de pagamento\n- Turnos com totais de sistema/declarado/falta\n- Rankings de vendedores e vendedor x loja\n\nAutorizacao:\n- Requer `auth:sanctum`\n- Usuario comum: apenas lojas vinculadas em `store_users`\n- Super admin: visao global"
  -
    name: 'PDV - Admin'
    description: "\nEndpoints administrativos para observabilidade do pipeline PDV Sync.\n\nInclui:\n- consulta de syncs recebidos (`/admin/pdv/syncs`)\n- metricas operacionais consolidadas (`/admin/pdv/syncs/metrics`)\n\nAcesso:\n- super admin, ou\n- usuario com role `admin` em alguma loja"
  -
    name: Dashboards
    description: "\nEndpoints de dashboard com métricas e KPIs personalizados por perfil de usuário.\n\nCada dashboard retorna informações otimizadas para o papel do usuário:\n- **Vendedor**: Foco em gamificação, bônus e comissão pessoal\n- **Conferente**: Foco em fechamentos pendentes e integridade de caixa\n- **Admin/Gerente**: Visão consolidada de todas as lojas\n\n**Regras de Acesso:**\n- Usuário só vê dados das lojas às quais tem acesso\n- Dashboard específico depende da role do usuário na loja"
  -
    name: Vendas
    description: "\nGerenciamento de vendas registradas no sistema MaisCapinhas ERP.\n\nAs vendas são o **coração do sistema financeiro**, pois a partir delas\nsão calculados:\n- **Bônus diário** - baseado no total de vendas do dia\n- **Comissão mensal** - baseado no atingimento de meta\n- **KPIs de desempenho** - taxa de conversão, ticket médio\n\n**Fontes de Vendas:**\n| Origem | Descrição |\n|--------|-----------|\n| `pdv` | Importação automática do sistema de PDV |\n| `manual` | Cadastro manual via esta API |\n| `import` | Importação em lote (planilha CSV) |\n\n**Regras de Negócio Importantes:**\n- Cada venda pertence a uma **loja** (`store_id`) e um **vendedor** (`seller_id`)\n- A venda conta para a meta da **loja** onde foi realizada\n- A comissão vai para o **vendedor**, mesmo que seja \"volante\"\n- Alterações em vendas disparam recálculo automático de bônus/comissão\n\n**Impacto no Bônus:**\nQuando uma venda é criada/alterada, o sistema automaticamente\nrecalcula o bônus diário do vendedor (via Job assíncrono)."
  -
    name: 'Turnos de Caixa'
    description: "\nEndpoints para gerenciar turnos de caixa.\nCada turno representa um período de trabalho de um vendedor em uma loja."
  -
    name: 'Fechamento de Caixa'
    description: "\nEndpoints para gerenciar o fluxo de fechamento de caixa.\n\n**Workflow de Estados:**\n```\ndraft → submitted → approved\n                  → rejected → draft → ...\n```\n\n- `draft` - Rascunho (editável)\n- `submitted` - Enviado para conferência\n- `approved` - Aprovado (imutável)\n- `rejected` - Rejeitado (volta para draft para correção)"
  -
    name: 'Regras de Bônus'
    description: "\nGerenciamento de regras de bônus diário.\nRegras definem faixas de vendas mínimas e valores de bônus correspondentes.\n\n**Hierarquia de regras:**\n- Regra específica de loja (`store_id` preenchido) tem prioridade sobre regra global\n- Regra mais recente (`effective_from` maior) tem prioridade\n- Versionamento automático a cada atualização"
  -
    name: 'Regras de Comissão'
    description: "\nGerenciamento de regras de comissão mensal.\nRegras definem faixas de atingimento de meta e taxas de comissão.\n\n**Hierarquia de regras:**\n- Regra específica de loja tem prioridade sobre global\n- Comissão calculada: vendas × taxa (baseada no % de atingimento)"
  -
    name: 'Metas Mensais'
    description: "\nGerenciamento de metas mensais por loja e distribuição entre vendedores (splits).\nCada split define a porcentagem da meta que cada vendedor deve atingir.\n\n**Regra:** A soma dos splits deve ser exatamente 100%."
  -
    name: 'Extrato Financeiro'
    description: "\nEndpoints para consultar o extrato de bônus diário e comissão mensal.\nVendedores veem apenas seus próprios dados; gerentes/admins veem todos."
  -
    name: 'People Analytics'
    description: "\nEndpoints para consultar e inserir KPIs de fluxo de pessoas por turno.\nDados podem vir de sincronização com FastAPI ou inserção manual."
  -
    name: 'Admin - Graph Visualization'
    description: ''
  -
    name: 'Admin - Modules'
    description: ''
  -
    name: 'Admin - Permissions'
    description: ''
  -
    name: 'Admin - Roles'
    description: ''
  -
    name: 'Admin - Store Permission Overrides'
    description: ''
  -
    name: 'Admin - User Permission Overrides'
    description: ''
  -
    name: 'Admin - User Role Assignments'
    description: ''
  -
    name: 'Administração - Logs de Auditoria'
    description: "\nConsulta de logs de auditoria do sistema.\n\nEste endpoint permite que administradores visualizem todas as\nações registradas no sistema para fins de auditoria e compliance.\n\n**Tipos de eventos registrados:**\n| Domínio | Eventos |\n|---------|---------|\n| `auth` | login, logout, login_failed |\n| `cash` | cash_closing.submit, approve, reject |\n| `rules` | bonus/commission create, update, delete |\n| `goals` | monthly.create, update, splits.set |\n| `sales` | create, update, delete |\n| `admin` | user/store create, update, delete |\n\n**Quem pode usar:** Apenas administradores."
  -
    name: 'Administração - Lojas'
    description: "\nGerenciamento das lojas (pontos de venda) do sistema MaisCapinhas ERP.\n\nCada loja representa uma unidade física de venda com:\n- Equipe própria (vendedores, conferentes, gerentes)\n- Metas mensais individuais\n- Turnos de caixa e fechamentos\n- Regras de bônus/comissão (podem ser específicas ou herdar as globais)\n\n**Hierarquia de Dados:**\n```\nLoja\n├── Usuários (via store_users com roles)\n├── Vendas (registradas por vendedores)\n├── Turnos de Caixa (por data/turno/vendedor)\n├── Metas Mensais (com splits por vendedor)\n└── Regras de Bônus/Comissão (opcionais, específicas)\n```\n\n**Regras de Negócio:**\n- Uma loja desativada não aparece na lista de lojas do usuário comum\n- Dados históricos são mantidos para auditoria\n- Lojas são identificadas por ID numérico (não há código de loja)\n\n**Auditoria:** Todas as operações são registradas via Spatie ActivityLog."
  -
    name: 'Administração - Usuários'
    description: "\nGerenciamento centralizado de usuários do sistema MaisCapinhas ERP.\n\nEste módulo permite criar, editar, listar e desativar usuários,\nalém de vincular usuários a lojas com roles específicas.\n\n**Modelo de Permissões:**\n- Cada usuário pode estar vinculado a múltiplas lojas\n- Em cada loja, o usuário tem uma role: `admin`, `gerente`, `conferente` ou `vendedor`\n- Usuários desativados perdem acesso a todos os endpoints protegidos\n\n**Regras de Negócio:**\n- Email deve ser único no sistema\n- Não é possível desativar o próprio usuário\n- Ao desativar, todos os tokens de acesso são revogados\n\n**Auditoria:** Todas as operações são registradas via Spatie ActivityLog."
  -
    name: 'Administração - Vínculos Loja-Usuário'
    description: "\nGerenciamento dos vínculos entre lojas e usuários (tabela `store_users`).\n\nEste módulo controla **qual usuário trabalha em qual loja** e com\n**qual nível de permissão (role)**.\n\n**Sistema de Roles:**\n| Role | Pode fazer |\n|------|------------|\n| `admin` | Tudo: gerenciar usuários, lojas, regras, confirmar comissões |\n| `gerente` | Gerenciar equipe da loja, aprovar fechamentos, ver dashboards |\n| `conferente` | Aprovar/rejeitar fechamentos de caixa |\n| `vendedor` | Registrar vendas, submeter fechamento do próprio turno |\n\n**Regras de Negócio:**\n- Um usuário pode ter roles diferentes em lojas diferentes\n- A role `admin` em qualquer loja dá acesso administrativo global\n- Vendedor \"volante\" pode trabalhar temporariamente em outra loja\n- Não é possível remover seu próprio vínculo (proteção)\n\n**Vínculo × Comissão:**\n- Vendas são sempre registradas na loja onde ocorreram (`store_id` da venda)\n- Comissão vai para o vendedor que realizou a venda (`seller_id`)\n- Meta é calculada pela loja + split configurado"
  -
    name: 'Administração - WhatsApp'
    description: "\nGerenciamento de instâncias WhatsApp (Evolution API).\n\nEste módulo permite criar, editar, listar e gerenciar instâncias do WhatsApp\nconectadas via Evolution API. Apenas super admins têm acesso.\n\n**Modelo de Escopos:**\n- Global: `store_id = null` e `user_id = null` (para notificações gerais)\n- Por Loja: `store_id` preenchido (instância específica da loja)\n- Por Usuário: `user_id` preenchido (instância específica do usuário)\n\n**Secrets:**\n- `api_key` e `token` são criptografados em repouso\n- Nunca são retornados nas responses (apenas masked values)"
  -
    name: Bio
    description: "\nEndpoints públicos para exibição na Bio do Instagram.\nEstes endpoints não requerem autenticação."
  -
    name: 'Capas Personalizadas'
    description: "\nGestão de capas de celular personalizadas.\nCapas são produtos criados sob demanda com fotos enviadas pelos clientes.\n\n**Fluxo de status:**\n1. Aguardando Foto (1) → Cliente envia foto\n2. Encomenda Solicitada (2) → Aguardando produção\n3. Capa Paga (3) → Pagamento registrado\n4. Pronta para entrega (4) → Produção concluída\n5. Entregue (5) → Cliente recebeu\n6. Cancelada (6)\n\n**Escopo de acesso:**\n- Super admins e admins globais: acesso a todas as capas\n- Outros usuários: apenas capas que criaram\n\n**Permissões:** Todos os usuários autenticados (exceto endpoints públicos)."
  -
    name: 'Catálogo - Marcas de Telefone'
    description: "\nGestão de marcas de telefone do catálogo.\nMarcas são usadas para categorizar modelos de telefone.\n\n**Leitura:** Todos os usuários autenticados.\n**Escrita:** Apenas administradores."
  -
    name: 'Catálogo - Modelos de Telefone'
    description: "\nGestão de modelos de telefone do catálogo.\nModelos são vinculados a marcas e usados para associar dispositivos de clientes.\n\n**Leitura:** Todos os usuários autenticados.\n**Escrita:** Apenas administradores."
  -
    name: Clientes
    description: "\nGestão de clientes e seus dispositivos (celulares).\nClientes são usados para associar pedidos e capas personalizadas.\n\n**Escopo de acesso:**\n- Super admins e admins globais: acesso a todos os clientes\n- Outros usuários: apenas clientes que criaram ou possuem pedidos/capas associadas\n\n**Permissões:** Todos os usuários autenticados."
  -
    name: Comemorações
    description: "\nEndpoints para exibir aniversariantes de nascimento e de empresa."
  -
    name: Comunicados
    description: "\nAPI para gerenciamento de comunicados."
  -
    name: 'Comunicação Interna - Avisos'
    description: "\nEndpoints para gerenciamento de avisos e comunicados internos.\nO sistema permite criar, publicar e acompanhar avisos direcionados a:\n- **Todos os usuários** (scope global)\n- **Lojas específicas** (scope store)\n- **Usuários específicos** (scope user)\n- **Cargos específicos** (scope role)\n\n**Funcionalidades:**\n- Criação e edição de avisos com suporte a imagens e call-to-action\n- Publicação imediata ou agendada\n- Controle de leitura (seen), confirmação (ack) e dispensa (dismiss)\n- Estatísticas de engajamento em tempo real\n- Duplicação e republicação de avisos arquivados\n\n**Níveis de severidade:** `info`, `warning`, `danger`\n\n**Permissões:** Apenas administradores e gerentes podem criar e gerenciar avisos."
  -
    name: 'Formas de Pagamento'
    description: "\nGestão de formas de pagamento do sistema.\nFormas de pagamento disponíveis: Dinheiro, Pix, Débito, Crédito, etc.\n\n**Leitura:** Todos os usuários autenticados.\n**Escrita:** Apenas Super Admin e Admin Global."
  -
    name: 'Fábrica - Pedidos de Produção'
    description: "\nPortal da fábrica para gestão de pedidos de produção de capas personalizadas.\nEstes endpoints são exclusivos para usuários com papel de fábrica (middleware `fabrica`).\n\n**Fluxo de produção:**\n1. Admin envia capas para produção → Pedido criado com status `pending`\n2. Fábrica aceita pedido (informa valor) → Status `accepted`\n3. Fábrica despacha pedido (informa rastreio) → Status `dispatched`\n4. Admin recebe pedido → Status `received`\n\n**Permissões:** Apenas usuários com papel de fábrica."
  -
    name: Outros
    description: ''
  -
    name: Pedidos
    description: "\nGestão de pedidos de clientes nas lojas.\nPedidos representam solicitações de clientes que podem incluir capas personalizadas ou produtos do catálogo.\n\n**Escopo de acesso:**\n- Super admins e admins globais: acesso a todos os pedidos\n- Outros usuários: apenas pedidos que criaram\n\n**Status do pedido:** 1=Novo, 2=Em produção, 3=Pronto, 4=Entregue, 5=Cancelado\n\n**Permissões:** Todos os usuários autenticados."
  -
    name: 'Produção - Administração'
    description: "\nAções administrativas do sistema de produção.\n\n**Permissões:** Apenas super administradores."
  -
    name: 'Produção - Carrinho'
    description: "\nGerenciamento do carrinho de produção para agrupar capas personalizadas antes de enviar à fábrica.\n\n**Fluxo do carrinho:**\n1. Obter/criar carrinho aberto (um por usuário por vez)\n2. Validar capas antes de adicionar (dry-run opcional)\n3. Adicionar capas ao carrinho\n4. Fechar carrinho → cria pedido de produção\n\n**Regras de negócio:**\n- Cada usuário pode ter apenas um carrinho aberto por vez\n- Capas devem estar com status \"Encomenda Solicitada\" para serem adicionadas\n- Capas já em outro carrinho/pedido são bloqueadas\n\n**Permissões:** Administradores e gerentes."
  -
    name: 'Produção - Pedidos (Admin)'
    description: "\nGestão de pedidos de produção pelo administrador.\nEstes endpoints são utilizados após o fechamento do carrinho de produção.\n\n**Fluxo do pedido:**\n1. Pedido criado ao fechar carrinho → Status `pending`\n2. Fábrica aceita → Status `accepted`\n3. Fábrica despacha → Status `dispatched`\n4. Admin recebe → Status `received` (este controller)\n5. Ou Admin cancela → Status `cancelled`\n\n**Permissões:** Administradores e gerentes."
  -
    name: 'Relatórios - Ranking'
    description: "\nEndpoints para ranking de vendedores e consultas relacionadas."
  -
    name: 'Relatórios Gerenciais'
    description: "\nEndpoints de relatórios avançados para gestão e auditoria.\n\nEste módulo fornece KPIs estratégicos para tomada de decisão:\n- **Performance de Loja** - Atingimento de meta, crescimento YoY, projeções\n- **Integridade de Caixa** - % de quebra, divergências, alertas\n\n**Público-alvo:**\n- Gerentes e Admins para visão estratégica\n- Conferentes para auditoria de caixa\n- Sócios para acompanhamento financeiro\n\n**Cache:** Dados históricos (ano passado) são cacheados para performance."
  -
    name: 'WhatsApp - Mensagens'
    description: "\nEndpoints para envio de mensagens e verificação de números via WhatsApp.\n\nEstes endpoints permitem que o sistema envie mensagens através\ndas instâncias WhatsApp configuradas.\n\n**Autorização:**\n- Super admin: acesso total a qualquer instância\n- Usuários: acesso a instâncias do seu escopo (user/store/global)\n\n**Resolução de Instância:**\nSe não informar instance_id, o sistema resolve automaticamente:\n1. Instância do usuário (se existir)\n2. Instância da loja (se usuário tiver vínculo)\n3. Instância global favorita"
  -
    name: 'Wheel - Analytics'
    description: "\nAPI para analytics e dashboard do módulo Roleta."
  -
    name: 'Wheel - Campaigns'
    description: "\nAPI para gerenciamento de Campanhas do módulo Roleta."
  -
    name: 'Wheel - Events/Logs'
    description: "\nAPI para visualização de logs de eventos do módulo Roleta."
  -
    name: 'Wheel - Inventory'
    description: "\nAPI para gerenciamento de Inventário/Estoque de prêmios do módulo Roleta."
  -
    name: 'Wheel - Players (Admin)'
    description: "\nAPI para gerenciamento de Jogadores do módulo Roleta."
  -
    name: 'Wheel - Prize Rules (Admin)'
    description: "\nAPI para gerenciamento de Regras de Prêmios."
  -
    name: 'Wheel - Prizes'
    description: "\nAPI para gerenciamento de Prêmios do módulo Roleta."
  -
    name: 'Wheel - Screens (TVs)'
    description: "\nAPI para gerenciamento de TVs/Totens do módulo Roleta."
  -
    name: 'Wheel - Segments'
    description: "\nAPI para gerenciamento de Segmentos (fatias da roleta) do módulo Roleta."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "    Para obter um token, faça login em `POST /api/v1/auth/login` com email e senha.\n\n    **Usuários de teste:**\n    - `admin@maiscapinhas.com.br` / `password` (Admin - todas as lojas)\n    - `joao.vendedor@maiscapinhas.com.br` / `password` (Vendedor - Tijucas)\n\n    O token deve ser enviado no header `Authorization: Bearer {token}`.\n\n    **Modo SPA (Cookie):** Para aplicações frontend, use `withCredentials: true` após obter o CSRF token em `/sanctum/csrf-cookie`."
security:
  -
    default: []
paths:
  /api/v1/health:
    get:
      summary: 'Verificar saúde da API'
      operationId: verificarSadeDaAPI
      description: "Retorna o status de saúde da API. Use este endpoint para\nverificar se a API está online e respondendo corretamente.\n\n**Casos de uso:**\n- Monitoramento de uptime (Uptime Robot, Pingdom, etc.)\n- Health checks em load balancers\n- Verificação de conectividade antes de operações\n\n**Resposta:**\n- `status: \"ok\"` - API funcionando normalmente\n- `timestamp` - Data/hora ISO 8601 da requisição"
      parameters: []
      responses:
        200:
          description: 'API saudável'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    status: ok
                    timestamp: '2026-01-07T12:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00+00:00'
      tags:
        - 'Saúde & Versão'
      security: []
  /api/v1/version:
    get:
      summary: 'Obter versão da API'
      operationId: obterVersoDaAPI
      description: "Retorna informações sobre a versão atual da API, incluindo\nversões do PHP e Laravel utilizadas.\n\n**Casos de uso:**\n- Verificar compatibilidade de versão antes de integrações\n- Debug e troubleshooting\n- Documentação técnica\n\n**Resposta:**\n- `name` - Nome da API\n- `api` - Versão da API (v1, v2, etc.)\n- `php` - Versão do PHP\n- `laravel` - Versão do Laravel"
      parameters: []
      responses:
        200:
          description: 'Versão atual'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    name: 'MaisCapinhas ERP API'
                    api: v1
                    php: 8.3.16
                    laravel: 12.45.2
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: 'MaisCapinhas ERP API'
                      api:
                        type: string
                        example: v1
                      php:
                        type: string
                        example: 8.3.16
                      laravel:
                        type: string
                        example: 12.45.2
      tags:
        - 'Saúde & Versão'
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Fazer login e obter token'
      operationId: fazerLoginEObterToken
      description: "Autentica o usuário e retorna um Bearer Token para uso nas próximas requisições.\n\n**Quem pode usar:** Qualquer usuário ativo com email e senha válidos.\n\n**Regras de negócio:**\n- Usuários inativos (`active = false`) não podem fazer login\n- O token não expira automaticamente, mas pode ser revogado via logout\n- Cada login gera um novo token (múltiplos dispositivos são permitidos)\n- Todas as tentativas de login são registradas para auditoria\n\n**Erros possíveis:**\n- `422` - Credenciais inválidas ou conta desativada"
      parameters: []
      responses:
        200:
          description: 'Login bem-sucedido'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    token: 1|abc123xyz...
                    token_type: Bearer
                    user:
                      id: 1
                      name: 'Admin Sistema'
                      email: admin@maiscapinhas.com.br
                  meta:
                    request_id: abc-123
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|abc123xyz...
                      token_type:
                        type: string
                        example: Bearer
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Admin Sistema'
                          email:
                            type: string
                            example: admin@maiscapinhas.com.br
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: abc-123
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Credenciais inválidas'
                    type: object
                    example:
                      message: 'The provided credentials are incorrect.'
                      errors:
                        email:
                          - 'The provided credentials are incorrect.'
                    properties:
                      message:
                        type: string
                        example: 'The provided credentials are incorrect.'
                      errors:
