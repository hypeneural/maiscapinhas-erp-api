                      name:
                        type: string
                        example: 'João Silva Santos'
                      email:
                        type: string
                        example: joao.silva@maiscapinhas.com.br
                      active:
                        type: boolean
                        example: true
                      created_at:
                        type: string
                        example: '2026-01-07T17:00:00Z'
                      stores:
                        type: array
                        example:
                          -
                            store_id: 1
                            store_name: 'Mais Capinhas Tijucas'
                            role: vendedor
                        items:
                          type: object
                          properties:
                            store_id:
                              type: integer
                              example: 1
                            store_name:
                              type: string
                              example: 'Mais Capinhas Tijucas'
                            role:
                              type: string
                              example: vendedor
        422:
          description: 'Email duplicado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    email:
                      - 'Este email já está em uso.'
                properties:
                  message:
