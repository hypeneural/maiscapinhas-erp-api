    post:
      summary: 'Criar novo usuário'
      operationId: criarNovoUsurio
      description: "Cadastra um novo usuário no sistema, opcionalmente já vinculando-o\na uma ou mais lojas com roles específicas.\n\nEste endpoint é utilizado para:\n- Onboarding de novos funcionários\n- Criar usuários administrativos\n- Configurar equipe de vendas\n\n**Fluxo recomendado:**\n1. Criar usuário com dados básicos + senha temporária\n2. Vincular às lojas onde irá trabalhar\n3. Compartilhar credenciais com o novo usuário\n\n**Regras de Negócio:**\n- Email deve ser único (validação 422 se duplicado)\n- Senha deve ter mínimo 8 caracteres\n- Vínculos são opcionais na criação (podem ser adicionados depois)\n- Se informar vínculos, `store_id` deve existir e `role` deve ser válida\n\n**Quem pode usar:** Apenas administradores."
      parameters: []
      responses:
        201:
          description: 'Usuário criado com vínculos'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 11
                    name: 'João Silva Santos'
                    email: joao.silva@maiscapinhas.com.br
                    active: true
                    created_at: '2026-01-07T17:00:00Z'
                    stores:
                      -
                        store_id: 1
                        store_name: 'Mais Capinhas Tijucas'
                        role: vendedor
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 11
                      name:
                        type: string
                        example: 'João Silva Santos'
                      email:
                        type: string
                        example: joao.silva@maiscapinhas.com.br
                      active:
                        type: boolean
                        example: true
                      created_at:
                        type: string
                        example: '2026-01-07T17:00:00Z'
                      stores:
                        type: array
                        example:
                          -
                            store_id: 1
                            store_name: 'Mais Capinhas Tijucas'
                            role: vendedor
                        items:
                          type: object
                          properties:
                            store_id:
                              type: integer
                              example: 1
                            store_name:
                              type: string
                              example: 'Mais Capinhas Tijucas'
                            role:
                              type: string
                              example: vendedor
        422:
          description: 'Email duplicado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    email:
                      - 'Este email já está em uso.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'Este email já está em uso.'
                        items:
                          type: string
