                          type: integer
                          example: 1
                        store_id:
                          type: integer
                          example: 1
                        seller_id:
                          type: integer
                          example: 6
                        sold_at:
                          type: string
                          example: '2026-01-07T10:30:00Z'
                        amount:
                          type: number
                          example: 150.0
                        source:
                          type: string
                          example: pdv
                        store:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 'Mais Capinhas Tijucas'
                        seller:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 6
                            name:
                              type: string
