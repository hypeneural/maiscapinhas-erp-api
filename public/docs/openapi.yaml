        -
          in: query
          name: store_id
          description: 'Filtrar por loja (deve ter acesso).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filtrar por loja (deve ter acesso).'
            example: 1
        -
          in: query
          name: seller_id
          description: 'Filtrar por vendedor específico.'
          example: 6
          required: false
          schema:
            type: integer
            description: 'Filtrar por vendedor específico.'
            example: 6
        -
          in: query
          name: from
          description: 'Data inicial (YYYY-MM-DD).'
          example: '2026-01-01'
          required: false
          schema:
            type: string
            description: 'Data inicial (YYYY-MM-DD).'
            example: '2026-01-01'
