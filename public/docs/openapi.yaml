                            city: Tijucas
                            role: admin
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 'Mais Capinhas Tijucas'
                            city:
                              type: string
                              example: Tijucas
                            role:
                              type: string
                              example: admin
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-10T12:00:00Z'
