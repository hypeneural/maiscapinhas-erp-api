                      active: true
                      whatsapp: '47999999999'
                      avatar_url: 'https://example.com/avatar.jpg'
                      instagram: '@maiscapinhas'
                      birth_date: '1990-05-15'
                      hire_date: '2022-01-09'
                      created_at: '2026-01-01T00:00:00+00:00'
                    stores:
