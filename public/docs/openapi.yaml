        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nome completo do usuário.'
                  example: 'João Silva Santos'
                email:
                  type: string
                  description: 'Email único para login.'
                  example: joao.silva@maiscapinhas.com.br
                password:
                  type: string
                  description: 'Senha de acesso (mínimo 8 caracteres).'
                  example: senha123456
                active:
                  type: boolean
                  description: 'Define se usuário está ativo (default: true).'
                  example: true
                is_super_admin:
                  type: boolean
                  description: ''
                  example: true
                zip_code:
                  type: string
                  description: 'Must not be greater than 8 characters.'
                  example: vdljnikh
                  nullable: true
                street:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: w
                  nullable: true
                number:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: aykcmyuwpwlvqwrs
                  nullable: true
                complement:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                  nullable: true
                neighborhood:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: t
                  nullable: true
                city:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: c
                  nullable: true
                state:
                  type: string
                  description: 'Must be 2 characters.'
                  example: ps
                  nullable: true
                birth_date:
                  type: string
                  description: 'Must be a valid date. Must be a date before <code>today</code>.'
                  example: '2022-03-07'
                  nullable: true
                hire_date:
                  type: string
                  description: 'Must be a valid date. Must be a date before or equal to <code>today</code>.'
                  example: '2022-03-07'
                  nullable: true
                whatsapp:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: ngzmiyvdljnikhwa
                  nullable: true
                instagram:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'y'
                  nullable: true
                cpf:
                  type: string
                  description: 'Must not be greater than 14 characters.'
                  example: kcmyuwpwlvqwrs
                  nullable: true
                pix_key:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                  nullable: true
                stores:
                  type: array
                  description: 'Lista de lojas para vincular na criação.'
                  example:
