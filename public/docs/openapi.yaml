  '/api/v1/cash/closings/{shift_id}/submit':
    post:
      summary: 'Enviar fechamento para conferência'
      operationId: enviarFechamentoParaConferncia
      description: "Envia um fechamento de caixa para ser conferido/aprovado.\nO fechamento deve estar em status `draft` ou `rejected` para ser enviado.\n\n**Quem pode usar:** Vendedor responsável pelo turno ou níveis superiores.\n\n**Regras de negócio:**\n- Todas as divergências (diff_value ≠ 0) devem ter justificativa preenchida\n- O status deve ser `draft` ou `rejected` para poder enviar\n\n**Erros possíveis:**\n- `409` - Status inválido (já enviado ou aprovado)\n- `422` - Divergências sem justificativa\n- `403` - Sem acesso à loja\n- `404` - Fechamento não encontrado"
      parameters: []
      responses:
        200:
          description: 'Enviado com sucesso'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: submitted
                    version: 1
                    lines: []
                    cash_shift:
                      id: 1
                      date: '2026-01-07'
                      shift_code: M
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: submitted
                      version:
                        type: integer
                        example: 1
                      lines:
                        type: array
                        example: []
                      cash_shift:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          date:
                            type: string
                            example: '2026-01-07'
                          shift_code:
                            type: string
                            example: M
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
        409:
          description: 'Status inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: 409
                    message: "Cannot submit closing with status 'approved'."
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 409
                      message:
                        type: string
                        example: "Cannot submit closing with status 'approved'."
        422:
          description: 'Divergência sem justificativa'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'All divergences must be justified before submitting.'
                  errors:
                    lines:
                      - "Linha 'Dinheiro' possui divergência sem justificativa."
                properties:
                  message:
                    type: string
                    example: 'All divergences must be justified before submitting.'
                  errors:
                    type: object
                    properties:
                      lines:
                        type: array
                        example:
                          - "Linha 'Dinheiro' possui divergência sem justificativa."
                        items:
                          type: string
      tags:
        - 'Fechamento de Caixa'
    parameters:
      -
        in: path
        name: shift_id
        description: 'The ID of the shift.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: shift
        description: 'ID do turno.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/cash/closings/{shift_id}/approve':
    post:
      summary: 'Aprovar fechamento de caixa'
      operationId: aprovarFechamentoDeCaixa
      description: "Aprova um fechamento que foi enviado para conferência.\nEsta ação é **irreversível** - fechamentos aprovados não podem ser editados.\n\n**Quem pode usar:** Conferentes, Gerentes ou Admins da loja.\n\n**Regras de negócio:**\n- O fechamento deve estar em status `submitted`\n- Após aprovação, os dados são considerados oficiais para cálculo de bônus/comissão\n\n**Erros possíveis:**\n- `409` - Status inválido (não está em submitted)\n- `403` - Sem permissão para aprovar\n- `404` - Fechamento não encontrado"
      parameters: []
      responses:
        200:
          description: 'Aprovado com sucesso'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: approved
                    closed_by: 3
                    closed_at: '2026-01-07T12:00:00+00:00'
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: approved
                      closed_by:
                        type: integer
                        example: 3
                      closed_at:
                        type: string
                        example: '2026-01-07T12:00:00+00:00'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
        409:
          description: 'Não pode aprovar'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: 409
                    message: "Cannot approve closing with status 'draft'."
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 409
                      message:
                        type: string
                        example: "Cannot approve closing with status 'draft'."
      tags:
        - 'Fechamento de Caixa'
    parameters:
      -
        in: path
        name: shift_id
        description: 'The ID of the shift.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: shift
        description: 'ID do turno.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/cash/closings/{shift_id}/reject':
    post:
      summary: 'Rejeitar fechamento de caixa'
      operationId: rejeitarFechamentoDeCaixa
      description: "Rejeita um fechamento enviado para conferência, retornando-o ao status `draft`\npara que o vendedor possa corrigir os problemas apontados.\n\n**Quem pode usar:** Conferentes, Gerentes ou Admins da loja.\n\n**Regras de negócio:**\n- O fechamento deve estar em status `submitted`\n- É obrigatório informar o motivo da rejeição (mín. 10 caracteres)\n- O vendedor será notificado e poderá reenviar após correções\n\n**Erros possíveis:**\n- `409` - Status inválido (não está em submitted)\n- `403` - Sem permissão para rejeitar\n- `422` - Motivo não informado ou muito curto"
      parameters: []
      responses:
        200:
          description: 'Rejeitado com sucesso'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: rejected
                  meta:
                    timestamp: '2026-01-07T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: rejected
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-01-07T12:00:00Z'
        422:
          description: 'Motivo não informado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The reason field is required.'
                  errors:
                    reason:
                      - 'The reason field is required.'
                properties:
                  message:
                    type: string
                    example: 'The reason field is required.'
                  errors:
                    type: object
                    properties:
                      reason:
                        type: array
                        example:
                          - 'The reason field is required.'
                        items:
                          type: string
      tags:
        - 'Fechamento de Caixa'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 'Motivo da rejeição (mín. 10, máx. 500 caracteres).'
                  example: 'Valores de cartão não conferem com relatório do PDV.'
              required:
                - reason
    parameters:
      -
        in: path
        name: shift_id
        description: 'The ID of the shift.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: shift
        description: 'ID do turno.'
        example: 1
        required: true
        schema:
          type: integer
