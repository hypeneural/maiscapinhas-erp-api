      description: "Retorna ranking completo de vendedores ordenado por vendas no período.\n\n**Inclui:**\n- Pódio (top 3) em destaque\n- Ranking completo com estatísticas\n- Meta, atingimento e bônus acumulado de cada vendedor\n\n**Quem pode usar:** Todos os usuários autenticados."
      parameters:
        -
          in: query
          name: month
          description: 'Mês (YYYY-MM), default: mês atual.'
          example: 2026-01
          required: false
          schema:
            type: string
            description: 'Mês (YYYY-MM), default: mês atual.'
            example: 2026-01
        -
          in: query
          name: store_id
          description: 'Filtrar por loja.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filtrar por loja.'
            example: 1
        -
          in: query
          name: limit
          description: 'Limite de resultados (default: 50).'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Limite de resultados (default: 50).'
            example: 10
        -
          in: query
          name: order
          description: "Ordenação: 'desc' (melhores) ou 'asc' (piores). Default: desc."
          example: asc
          required: false
          schema:
            type: string
            description: "Ordenação: 'desc' (melhores) ou 'asc' (piores). Default: desc."
            example: asc
      responses:
        200:
          description: 'Ranking mensal'
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  \"data\": {\n    \"period\": \"2026-01\",\n    \"podium\": [\n      {\n        \"position\": 1,\n        \"seller\": { \"id\": 5, \"name\": \"João Silva\", \"avatar_url\": \"...\", \"store_name\": \"Tijucas\" },\n        \"total_sold\": 85000.00,\n        \"goal\": 75000.00,\n        \"achievement_rate\": 113.33,\n        \"bonus_accumulated\": 450.00\n      }\n    ],\n    \"ranking\": [...],\n    \"stats\": { \"total_sellers\": 25, \"above_goal\": 12, \"average_achievement\": 92.5 }\n  }\n}"
      tags:
        - 'Relatórios - Ranking'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                month:
                  type: string
                  description: 'Must match the regex /^\d{4}-\d{2}$/.'
                  example: 6425-59
                store_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the stores table.'
                  example: 16
                limit:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 22
                order:
                  type: string
                  description: ''
                  example: asc
                  enum:
                    - asc
                    - desc
