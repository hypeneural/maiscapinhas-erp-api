      responses:
        200:
          description: 'Venda excluída'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    message: 'Venda excluída com sucesso.'
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Venda excluída com sucesso.'
        403:
          description: 'Sem permissão'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Apenas admins podem excluir vendas.'
                properties:
                  message:
                    type: string
                    example: 'Apenas admins podem excluir vendas.'
      tags:
        - Vendas
